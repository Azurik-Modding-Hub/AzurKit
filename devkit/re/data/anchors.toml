# The game's VA anchors: each USA address a shim, a patch or a reader names, what the vanilla XBE holds there and
# what is known of it. Ported from Modkit's shim header (shims/include/azurik.h) at its last cut (Step 4.11d1); its
# structures are structs.h beside this file. A Modkit path, test or step in a note names Modkit's tree and history.
#
# Each anchor is a table: its USA `va`, the `section` that holds it and, outside .text, what the vanilla XBE holds
# there: an `f32`, a `u32`, a `cstr` (an ASCII C string), a `wstr` (a UTF-16LE one) or `zero`, that many zero bytes
# (the loader's zero-fill or the file's). One in .text is code: a function's entry, a patch site or a hook site.
# Europe's address is the facts' address map's (src/azurkit/core/facts.europe.json). tests/test_re_xbe.py holds both
# releases' XBEs to it, and devkit/re/xbe.py names each listed address (its name without AZURIK_ and _VA, lower
# case; the first anchor at an address names it).

# The pads and players (ControllerState in structs.h)

[AZURIK_CONTROLLER_STATE_VA]
va = 0x0037BE98
section = ".data"
zero = 4
note = """\
The 4 players' ControllerState array, player 0's first, 0x54 bytes apart (AZURIK_CONTROLLER_STRIDE), filled every \
frame by the XInput polling loop (FUN_000a2df0 -> FUN_000a2880). Zero-filled at load."""

[AZURIK_PLAYER_STATE_PTR_ARRAY_VA]
va = 0x001BE314
section = ".data"
zero = 4
note = """\
Per-player state-object pointer array: 4 x 4-byte slots; slot i holds a pointer to player i's live state struct (or \
NULL before that player joins). The XInput polling path FUN_000A2880 reads [player_idx * 4 + 0x001BE314] before \
writing into the controller-state block. Zero-filled at load, set by the engine as each controller connects."""

[AZURIK_ACTIVE_PLAYER_INDEX_VA]
va = 0x001A7AE4
section = ".data"
u32 = 4
note = """\
The active player's index: 0..3, or 4 for no controller connected (its vanilla value). Not the air-power level. A \
shim acting on the active player only dereferences &players[*0x001A7AE4] while it isn't 4."""

# The boot state machine (BootState in structs.h)

[AZURIK_BOOT_STATE_VA]
va = 0x001BF61C
section = ".data"
zero = 4
note = """\
The global boot state (a BootState), stepped by FUN_0005f620. Read / write via *(BootState *)0x001BF61C from within \
a shim. Writing advances the state machine; the game tolerates arbitrary forward jumps, but backward ones produce \
visible glitches (e.g. from INGAME back to PLAY_LOGO mid-game)."""

# Gravity, the player's character name and the shared run multiplier

[AZURIK_GRAVITY_VA]
va = 0x001980A8
section = ".rdata"
f32 = 9.8
note = """\
The world's gravity, 9.8 m/s^2: the single source of gravity for every falling entity. The player_physics gravity \
slider rewrites it in place."""

[AZURIK_SHARED_RUN_MULT_VA]
va = 0x001A25BC
section = ".rdata"
f32 = 3.0
note = """\
3.0, read at 45 call sites. Not a run speed: Azurik has no run, and the player-movement reader, the FMUL at VA \
0x849E4, is the developer cheat-buttons turbo (0 in retail). No pack rewrites that FMUL since Step 2.12 \
(roll_speed_scale hooks the CALL at 0x8C745); touching the shared constant would affect every other reader. See \
AZURIK_ROLL_BOOST_CONST_VA."""

[AZURIK_PLAYER_CHAR_NAME_VA]
va = 0x0019EA68
section = ".rdata"
cstr = "garret4"
note = """\
The player character's name, an 8-byte ASCII slot. The 4 bytes after it are a separate string, the drive root \
\"d:\\\" at VA 0x0019EA70. The spawn reads the player's species from this name (0x58E80 stores its VA in 0x1BCDCC). \
Nothing writes it since Step 2.21a: the player-model swap keeps species garret4 and edits config.xbr and fx.xbr \
(D112). Modkit's code before its reorganisation used its file offset (0x001976C8) as if it were a VA; a DIR32 \
relocation to the string must use this VA."""

