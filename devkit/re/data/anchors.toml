[AZURIK_PATCH_PEAK_Z_FADD_VA]
va = 0x00089154
section = ".text"
note = """\
The 6-byte FADD [ESI+0x144] in player_jump_init that feeds the peak_z latch (FSTP [ESI+0x164] at VA 0x8915A). The \
wing_flap_ceiling_scale slider puts a 15-byte CALL-style shim here: load flap_height, FMUL by the scale, FADDP the \
entity.z already on ST(0), RET, so peak_z = entity.z + K * flap_height. wing_flap (FUN_00089300) computes fVar1 = \
peak_z + flap_height - current_z, so the hard ceiling grows to (K+1) * flap_height above the jump's starting ground \
(vanilla K=1: 2 * flap_height). Orthogonal to flap_height_scale and flap_below_peak_scale."""

