scales it: 0.0 removes the per-flap gauge drain that stops descent flaps in vanilla. The 6.0 threshold at 0x001A25B8 \
can't be overwritten instead: 19 other functions read it."""

[AZURIK_PATCH_FLAP_ENTRY_FUEL_VA]
va = 0x0008934E
section = ".text"
note = """\
The 4-byte PUSH immediate (1.0f) in wing_flap feeding the consume_fuel(this, 1.0) call at VA 0x89354: the per-flap \
entry drain every flap pays, at any height. The flap_entry_fuel_cost_scale slider scales it: 0.1 gives about 10x the \
flaps per gauge, 0.0 no drain (flaps per jump stay capped at Flaps, D17; not infinite), a negative a refund. \
consume_fuel takes cost / Flaps (level+0x38: 1/2/5 for air 1/2/3) off the 1.0 gauge, so vanilla gives 1/2/5 flaps \
per gauge."""

