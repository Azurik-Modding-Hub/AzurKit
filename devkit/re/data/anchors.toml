CritterData.feature_class_id from a name string, looks it up. A shim could add feature classes at boot."""

[AZURIK_FEATURE_CLASS_REGISTRY_END_VA]
va = 0x0038C1F8
section = ".data"
zero = 4
note = "FeatureClass **end (one past the last)."

# The developer level-select hub

[AZURIK_DEV_MENU_FLAG_VA]
va = 0x001BCDD8
section = ".data"
zero = 4
note = """\
selector.xbr is a developer level-select hub (portals to every live level and direct cutscene playback), not the \
in-game cheat UI. 0x52F50 (game_start_setup, Ghidra's name since D94) reads this dword on its selector branch only: \
ESI = 3 when it holds -1 (vanilla), else its value; what ESI means is unknown. Whether levels/selector or \
levels/training_room becomes the candidate is decided by a virtual call's AL result at VA 0x52F90, not by this dword \
[verified 2026-10-10, capstone], and that candidate is only the second stage of a validator chain. The name and the \
old claim that one store here force-loads the hub are wrong; it was never tried, and four other attempts to force \
the hub had no in-game effect. See docs/RE_DATA.md, selector.xbr."""

