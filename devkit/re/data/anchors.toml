va = 0x001AAB68
section = ".data"
f32 = 2.0
note = """\
The slope slide's state-3 velocity scalar. Single reader: the FMUL at VA 0x89B76 in player_slope_slide_tick. \
Overwriting it had no in-game effect (slider deleted, D18)."""

[AZURIK_CLIMB_SPEED_CONST_VA]
va = 0x001980E4
section = ".rdata"
f32 = 2.0
note = """\
The climbing state's velocity scalar. Exactly 2 readers, both in player_climb_tick (VAs 0x87FA7 and 0x88357): the \
rung step (2.0 x dt a tick, xemu sitting 2.185) and the rung clips' rate. climb_speed_scale scales both readers and \
leaves the constant vanilla (Step 2.185)."""

[AZURIK_GRAVITY_CONST_VA]
va = 0x001980A8
section = ".rdata"
f32 = 9.8
note = """\
The global gravity constant. 16 references in .text (player states, the roll code, three boot initialisers). \
gravity_integrate_raw (0x85700) doesn't read it; its callers pass g as an argument. The gravity slider overwrites it \
on purpose (everything falls at the new g); jump_speed_scale and flap_height_scale instead rewrite their own FLD to \
load an injected g * k^2 (D16)."""

[AZURIK_FLAP_SUBSEQUENT_THRESHOLD_VA]
va = 0x001A25B8
section = ".rdata"
f32 = 6.0
note = """\
The subsequent flap's height threshold. Shared: 19 references in the XBE; wing_flap's is the FCOMP at VA 0x893C0. A \
flap more than 6 m below the flap ceiling (peak_z + h; the first flap too) has its v0 halved and calls \
consume_fuel(100.0). No slider; an RE anchor."""

[AZURIK_FLAP_HALVING_CONST_VA]
va = 0x001A2510
section = ".rdata"
f32 = 0.5
note = """\
The subsequent flap's halving factor. Shared (260+ readers: the generic half). The flap_below_peak_scale slider \
rewrites the FMUL at VA 0x893DD to read an injected float, not this constant."""

[AZURIK_FLAP_BOOST_CONST_VA]
va = 0x001A26C4
section = ".rdata"
f32 = 1.5
note = """\
The wing flap's final boost multiplier. Read at VA 0x893EB (wing_flap) and 10+ unrelated sites: rewrite per site \
only."""

[AZURIK_ROLL_BOOST_CONST_VA]
va = 0x001A25BC
section = ".rdata"
f32 = 3.0
note = """\
Shared (45 readers). The FMUL at VA 0x849E4 (player_input_tick) uses it as the developer cheat-buttons turbo (input \
flag 0x40, only while the cvar \"enable cheat buttons\" is on; 0 in retail). It is not the roll: roll_speed_scale \
hooks the CALL at VA 0x8C745 instead (Step 2.12)."""

[AZURIK_SWIM_BOOST_CONST_VA]
