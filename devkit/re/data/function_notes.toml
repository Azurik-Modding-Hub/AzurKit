# The game's functions' notes: what each function in the facts' list does and what a shim calling it must
# know, by its name in src/azurkit/core/facts.usa.json. Ported from Modkit's vanilla-symbol registry
# (azurik_mod/patching/vanilla_symbols.py, each entry's doc, unchanged) in its order at its last cut (Step 4.11d1):
# a function the facts renamed since (D94: Ghidra's names) keys its note by the facts' name, and a Modkit path,
# header or test in a note names Modkit's tree. tests/test_re_xbe.py holds its names to the facts' list.

play_movie_fn = """\
Boot-time movie player.  `name` is a path like 'AdreniumLogo.bik'; `flag` is a boolean (1 = prophecy-like, 0 = \
logo-like).  Returns AL=1 if the movie started (enter poll state), AL=0 if it didn't (skip to next boot state)."""
poll_movie = """\
Called once per frame while a movie is playing.  Takes a float dt.  Returns 0 = still playing, 1 = should-abort, 2 = \
movie finished."""
entity_lookup = """\
Looks up an entity descriptor by name.  __fastcall: name (byte *) in ECX, fallback (int *) in EDX.  Walks the global \
entity registry (DAT_0038C1E4..DAT_0038C1E8) comparing each entry's name against the needle; returns the matching \
descriptor pointer in EAX, or 0 if no match AND the fallback is NULL.  When the fallback is non-null and the lookup \
misses, the function registers the fallback as a new entry and returns it.\n\nABI verified from two callers \
(FUN_000353F0 and FUN_0003A610) both of which do ``MOV ECX, <name>; XOR/MOV EDX, <fallback>; CALL`` without any \
``ADD ESP, N`` cleanup afterward — __fastcall with 2 register args.\n\nSafe to call from shims that need to resolve \
named entities (critter descriptors, scripted pickups, etc.)."""
boot_state_tick = """\
Runs one tick of the boot-state machine.  __stdcall: dt (float) on stack.  Returns a boolean-ish value in AL (caller \
at VA 0x59BA5 does ``TEST AL, AL; JNZ ...`` to branch on the result).\n\nThis is the state-machine function that \
``qol_skip_logo`` shims into — it decides which movie / logo plays next. Shims that want to INTERCEPT boot-state \
transitions (rather than just skip a single movie) can wrap it: call the vanilla then post-process the AL return to \
force a different transition.\n\nMultiple ``RET 4`` exits confirm __stdcall with 1 arg. Return type formally \
undefined4 in Ghidra, but the only observed caller treats it as a byte — ``unsigned char`` is a safe shim-side \
declaration."""
config_name_lookup = """\
Look up a named entry in a config table.  __thiscall: ``this`` (the config table object) in ECX, needle (const char \
*) on the stack.  Callee does RET 4.\n\nABI pinned by: ``MOV EAX, [ECX]`` + ``MOV EDX, [ECX+4]`` prologue (ECX is \
``this``) + stack arg at [ESP+0x14] after 4 register pushes + return addr = first stack arg + closing ``C2 04`` (RET \
4).\n\nReturns an int (probably row index or entry offset).  The table is scanned byte-by-byte for a matching name — \
O(N) in table entries.  Callable directly from shim C via ``__attribute__((thiscall))``; no inline-asm wrapper \
needed (unlike ``gravity_integrate_raw``) because this is a pure thiscall without RVO / ESI context magic."""
config_cell_value = """\
Look up a cell value in a 2-D config grid.  __stdcall(16): ``(int *grid, int row, int col, double *default_out)`` on \
the stack, popped by the callee (RET 0x10; 136 call sites push four arguments and never clean up); returns a \
``float10`` (80-bit FPU value in ST(0)).\n\nThe function does bounds-checking on ``row`` and ``col`` against the \
grid's size fields (read at [ECX+8] and [ECX+0]) and panics via a logging call + INT3 if either is out of range — \
shims MUST NOT pass invalid indices."""
load_critters_config = """\
Boot-time loader that populates every runtime ``CritterData`` struct (``Entity *`` registry targets) from the seven \
``critters_*`` keyed-table assets in ``config.xbr``.  Sections visited in order:\n\n  1. ``config/critters_engine``       \
— collision + rendering fields (piVar9[0..0xD])\n  2. ``config/critters_critter_data`` — gameplay fields \
(piVar9[0x0E..0x43])\n  3. ``config/critters_damage``       — hitPoints + per-damage-type table (piVar9[5] + \
piVar9[0x23])\n  4. ``config/critters_damage_fx``    — per-type FX (piVar9[0x24])\n  5. ``config/critters_sounds``       \
— audio refs\n  6. ``config/critters_item_data``    — item drops\n  7. ``config/critters_special_anims`` — anim \
overrides\n\nIMPORTANT: ``hitPoints`` is read from the ``critters_damage`` grid (NOT ``critters_critter_data`` as a \
surface read of the CritterData struct layout might suggest).  The call at VA 0x495A0-ish does \
``config_name_lookup(critters_damage_grid, \"hitPoints\") → col_idx`` followed by ``config_cell_value(grid, row, \
col, default=&DAT_00195790)``; the result lands in ``piVar9[5]`` (struct offset 0x14, \
``CritterData.hit_points``).\n\nThe April 2026 caveat that config.xbr's ``critters_damage`` has no ``hitPoints`` \
column came from our labels, which were shifted by one table until AZ-113: the table at TOC offset 0x01A000 is \
``critters_damage`` and has ``garret4.hitPoints``.  The player never uses it: critter init 0x409C0 falls back to it \
only for a negative spawn HP (``docs/RE_MOVEMENT.md``, 2026-10-09).\n\nABI: __cdecl — callers (e.g. the boot \
data-load sequence) do CALL with no ADD ESP, N cleanup and the function uses ESP-relative stack allocation only \
(``SUB ESP, 0x8A8`` prologue).  No args."""
load_armor_properties_config = """\
Boot-time loader that populates DAT_0038C4D4 (the per-armor-slot struct array, 0x40 bytes per entry) from \
``config/armor_properties`` and DAT_0038C4AC (armor hit-fx slots, 0xC bytes per entry) from \
``config/armor_hit_fx``.\n\nFlaps path: reads the ``Flaps`` column as a ``double`` via ``config_cell_value(...)``, \
converts to int64 via ``FUN_000f5a40`` (FPU FISTP), stores the lower 32 bits at ``puVar1[0xE]`` (struct offset \
0x38).\n\nThe asset ``config/armor_properties`` is the keyed table at TOC offset 0x002000 (header at file offset \
0x3000), labelled ``armor_properties``.  0x004000 is ``attacks_anims`` (the attack animations, referenced at \
0x7E301), not dead armor data; the two were labelled ``armor_properties_real`` / ``armor_properties_unused`` until \
AZ-113."""
armor_reset_out_of_fuel = """\
Per-armor-slot reset helper invoked when an armor feature runs out of fuel (``puVar1[0xD]`` / fuel-state word \
reaches 0).  Takes the slot struct pointer (``int *``, layout documented in docs/RE_MOVEMENT.md under \
``armor_properties``) and:\n\n  1. Calls ``FUN_000836b0(slot)`` — inner zeroer.\n  2. Re-resolves the slot's \
``Armor`` row via ``config_name_lookup(config_ctx, \"Armor\")``.\n  3. Re-links ``slot[8]`` to a default feature via \
``FUN_0003c660(1)``.\n  4. Clears scratch: ``slot[0x17] = 0``, ``slot->+0x61 byte = 0``, ``slot[9] / [0xb] / [0xd] = \
0``.\n\nUsed by ``mark_armor_feature_used`` / the armor tick cluster.  Named in Ghidra by hand (April 2026 \
armor-state reverse-engineering pass).\n\nABI: __stdcall(4): the slot pointer on the stack, popped by the callee \
(RET 4; 11 call sites push it and never clean up)."""
mark_armor_feature_used = """\
Flips the ``used`` byte on the current player's armor feature slot if the slot is live (``fuel != 0``) and not \
already marked.  Per-controller state lives in the ControllerState array at 0x37BE98 (``azurik.h`` \
``ControllerState``; the Ghidra project and snapshot name it ``g_controller_state`` since 2026-10-11, D94/AZ-252, \
formerly ``g_armor_state_per_controller``) — 0x15 DWORDs per controller indexed by ``g_active_controller_index`` (4 \
= global fallback / preview).  The ``used`` byte is at ``slot + feature_idx + 0x48``.\n\nArguments: EDX = feature \
index (int, 0-based row into the per-controller 0x15-DWORD block), plus one stack DWORD the function never reads but \
pops (RET 4).  ECX is overwritten before it is read.\n\nNamed in Ghidra April 2026.  Relevant to any shim that wants \
to hook the armor-usage tracker (e.g. fuel HUD overlay, no-fuel-consumption cheat).\n\nABI: __fastcall(12), declared \
``void mark_armor_feature_used(unsigned unused_ecx, int feature_idx, unsigned unused_stack)`` so a C call loads EDX \
and pushes the 4 bytes RET 4 pops; 7 call sites do the same and never clean up."""
player_ground_attack_start = """\
The ground attack starter; the name is an old misreading and stays until the AzurKit 4.2/4.3 rename (P3-Q6, D68).  \
``player_physics_state_machine`` (0x0008CCC0) calls it at 0x8D13B, 0x8D211 and 0x8D465.  It picks an attack button \
from the input flags at input+0x20 (0x08, 0x10, and 0x20 = BLACK, which picks button 4 at 0x88B76) and from \
per-button doubles at entity+0xA0/+0xA8/+0xB0, starts the move through 0x7EF10 and the attack-move entry 0x88990 \
(state 0x100) and returns AL = 1.  With no attack it returns AL = 0, after setting entity+0x134 (the attack entry \
index) to -1 when the stack flag is nonzero.  It never calls or jumps to ``player_slope_slide_tick`` (0x00089A70) or \
0x8AE10 [verified 2026-10-10, capstone over 0x88A80-0x88E6F; ROLL_FINDINGS 2026-10-09].\n\nABI: EAX = entity and ESI \
= input, which all 3 call sites load right before the CALL, plus one stack byte flag (``char state_byte``, the reset \
flag) popped by the callee (RET 4 at 0x88B73 and 0x88E6C).  Declared __stdcall(4) for the stack part; EAX/ESI need \
an asm thunk like ``player_walk_state_call`` (none is provided)."""
load_asset_by_fourcc = """\
Get an asset by its handle and fourcc, loading it first when it isn't resident.  __stdcall(8): ``(int fourcc, int \
flags)`` on the stack, plus the asset's handle passed in EAX as an implicit register argument.  Returns a pointer to \
the asset's loaded payload in EAX, or 0 when it can't be had; a negative EAX comes back inverted (~EAX) with no \
lookup.  It blocks while the asset loads.\n\n[verified 2026-10-11, capstone] A negative EAX returns ~EAX \
(0xA67A8-0xA67B0).  Otherwise it calls 0xA59F0 with EAX = 2 (0xA67B6), which maps the handle to its run's 28-byte \
descriptor: handle bits 20-30 pick the archive in the table at [0x37BE34], the low 20 bits a slot of its u16 table \
at +0x28.  When the archive has no table, the slot is 0x8000 or the run's state (word +0x1A & 0x3000) is 0x1000, \
0xA59F0 stops there only for EAX = 0 (0xA5A68); with 2 it calls 0xA5980 (which also calls 0xA58A0 and waits, \
0xA599C-0xA59BC), then 0xA4C00 when there was no run (0xA5A8F), then 0xA5480 (0xA5AB2), which sets the state to \
0x2000 (0xA54D4), and it returns 0 when 0xA5980 or 0xA4C00 does.  Back here ``flags`` goes to 0xA6530; while the \
state is 0x2000 it calls 0xA58A0 and waits (0xE11EC with -1; 0xA67F0-0xA681C), and any state but 0x3000 then gives \
0.  The entry is the 16-byte TOC entry at [run+0xC] + 16 * (handle - [run+8]) (0xA6832-0xA683C); its fourcc at +8 \
must equal ``fourcc`` (0xA6842), and the result is [run+0x10] - toc[0].offset + entry.offset (0xA6847-0xA6852), a \
pointer into the run's loaded payload.  [inferred]: 0xA5980 gets the archive's header entry for the handle, 0xA4C00 \
builds a run and 0xA5480 starts its read; state 0x1000 is a run not yet read, 0x2000 one being read and 0x3000 one \
loaded.  It reads no index.xbr record, and how a name becomes a handle isn't traced.  The EAX-as-handle convention \
is Watcom-ish and NOT expressible via a native clang attribute — shim authors should prefer a call-through wrapper \
(template deferred until a real shim needs this).\n\nTypical fourcc values (little-endian packing):\n    0x78646E69  \
'indx' — indx section (the index table)\n    0x79646F62  'body' — character body meshes\n    0x6D6E6162  'banm' — \
bone animations\n    0x65646F6E  'node' — scene-graph nodes\n    0x66727573  'surf' — surface / material data\n    \
0x65766177  'wave' — audio blobs\n    0x6C76656C  'levl' — level descriptors\n\nUntil AZ-259 (2026-10-11) this said \
it looked up an index.xbr record by an asset index.  docs/RE_DATA.md § index.xbr says which table it reads instead."""
game_start_setup = """\
The game start/continue setup, which also picks the level to load (the name is an old misreading; HP research, \
2026-10-09).  __stdcall(12): three stack arguments, RET 0xC; 5 call sites push three arguments and never clean up.  \
It calls the new-game inventory reset 0x57B70 (at 0x52FD0 and 0x530C7) and sets current HP from settings_foo \
``initial hp`` at 0x532A7 (docs/RE_MOVEMENT.md 'Player HP comes from settings_foo') [verified 2026-10-10, capstone].  \
A virtual call's AL result at VA 0x52F90 picks the ``levels/selector`` string (0x001A1E3C, the developer \
level-select hub) or ``levels/training_room`` as the second-stage candidate of a three-stage level-name validator \
chain whose first stage, the caller's own level, almost always wins.  The BSS dword at ``AZURIK_DEV_MENU_FLAG_VA`` \
(0x001BCDD8) only sets ESI on the selector branch (3 when it holds -1); it doesn't gate the hub, and the name \
overstates its role [verified 2026-10-10, capstone].\n\nSee docs/RE_DATA.md § selector.xbr."""
calculate_save_signature = """\
Entry point for Azurik's save-slot sign / verify.  __thiscall: the save-slot context lives in ECX (path buffer at \
[ECX+0x20A], flag byte at [ECX+0x20A]'s high byte — 0x7A disables signing).\n\nIt returns at once when that byte is \
0x7A; otherwise it opens an HMAC-SHA1 context with XCalculateSignatureBegin(0), hashes the slot's file tree \
(FUN_0005C4B0), closes it with XCalculateSignatureEnd and writes the 20-byte digest to ``signature.sav`` in the \
slot.\n\nIts sibling verify_save_signature (0x5C990) recomputes the digest and compares it (docs/SAVE_FORMAT.md § \
7).  The hash-tree-walk is pinned in :mod:`azurkit.tools.saves.sign` for direct Python use."""
xcalculate_signature_begin = """\
XDK re-export.  ``XCalculateSignatureBegin(flags)`` — allocates + initialises an HMAC-SHA1 context keyed with \
``XboxSignatureKey``.  flags=0 means 'inner HMAC only' (no per-console HDKey outer layer); Azurik passes 0 from \
``calculate_save_signature``.\n\nReturns the hash-context pointer in EAX (opaque; pass to Update / End).  See \
docs/SAVE_FORMAT.md § 7 for the save-sign trace."""
xcalculate_signature_end = """\
XDK re-export.  ``XCalculateSignatureEnd(ctx, out20)`` — finalises the HMAC-SHA1 accumulator from Begin/Update and \
writes 20 bytes to ``out20``.  When the Begin-time flags requested the HDKey outer layer, that extra \
HMAC-SHA1(HDKey, inner) stage happens here too; otherwise this is plain HMAC-Final.\n\nPair with \
:data:`xcalculate_signature_begin`."""
