and the arrival.  Real ABI: [esp+4] the PlayerControl, EAX the tick's input (kept in EBP and EDI inside); RET 4 \
(0x8D3A6, 0x8D47B, 0x8D4B7).  Its one caller is the PlayerControl tick's CALL at 0x8C37D (``push edi; lea eax, \
[esp+0x24]``) [verified 2026-10-25: ``xbe dis 0x8C372:4``, ``xbe calls --to 0x8CCC0``; Europe 0x8CC70, called at \
0x8C32D].  The extern declares the stack part: jump to it from asm that keeps EAX.  The speed toggle (Step 2.186, \
D713) takes that CALL and reads the left stick click first."""
run_pages_alloc = """\
A virtual (mode-0) load run's memory: the size rounded up to 4 KiB, refused (0) when [0x1BF400] plus it passes the \
budget [0x1BF404], else VirtualAlloc's reserve and commit, the size added to [0x1BF400] (RET 4; callers 0xA490C, the \
run allocator's, 0xB54FB and 0xBACF8) [verified 2026-10-23: ``xbe fn``; Europe 0xBACE0].  qol_memory_upper64 (Step \
2.162e) takes the CALL at 0xA490C."""
VirtualFree = """\
XAPI's VirtualFree(address, size, type): NtFreeVirtualMemory, TRUE or FALSE (RET 0xC) [verified 2026-10-23: ``xbe \
fn``; Europe 0xE0E48].  The run free 0xBAD10 calls it at 0xBAD55, which qol_memory_upper64 (Step 2.162e) takes."""
run_evict_until = """\
evict(size, level): the expired list 0x1AA7F0 through 0xA6450, then, if it freed nothing and level >= 3, the expiry \
wheel's 30 slots until size bytes are freed; AL = 1 when anything was (RET 8; callers the out-of-memory handler \
0xA66A0 with level 3, D3D's 0x90801 and 0x90854, 0x24E23, 0xA4920, 0xA4CC2, 0xA66D1) [verified 2026-10-29: ``xbe \
dis``; Europe 0xA6650].  qol_alloc_race's copy gate (AZ-817, Step 2.172g) runs it at level 3, on main or in the copy \
thread."""
run_wheel_advance = """\
The run manager's per-frame step of the expiry wheel: the cursor [0x1BE324]'s slot moved to the expired list \
0x1AA7F0, the cursor advanced mod 30 (plain RET; no inputs; callers 0x15FB8, 0x1622B, 0x52D06, the main loop's \
0x59C90, 0xA66EB) [verified 2026-10-29: ``xbe dis``; Europe 0xA6430].  qol_alloc_race (AZ-817, Step 2.172g) takes \
