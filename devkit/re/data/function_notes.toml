gravity_integrate_raw = """\
RAW vanilla gravity-integration routine.  **Do NOT call this directly from shim C code** — its real ABI uses an \
MSVC-RVO extension that no clang calling-convention attribute can express natively:\n\n    ECX     = config struct \
pointer\n    EDX     = velocity / position ptr\n    EAX     = result struct pointer (RVO, implicit output)\n    ESI     \
= caller-provided player / entity context\n    [stack] = float gravity_dt (callee pops via RET 4)\n\nDeclared \
__fastcall(12) ``(config, vel_accumulator, float gravity_dt)``: ECX, EDX and the stack float the callee pops (6 call \
sites push it and never clean up).  Calling it from C still needs an inline-asm call-through wrapper that sets EAX / \
ESI before the CALL.  The unused wrapper and its header were deleted in REORG_PLAN Step 1.10 (D18); recover them \
from git history if a shim needs one.\n\nABI pinned from the caller at VA 0x860C8 (MOV ECX,EBP / LEA EDX,[ESP+0x1C] \
/ LEA EAX,[ESP+0xCC] / PUSH <gravity> / CALL), matched against the callee prolog's ``MOV EDI,[ECX]`` / ``MOV \
[EAX],EDI`` / ``FLD [ESI+0x28]`` accesses.  First RET is ``C2 04`` (pops 4 bytes = the stack float), confirming \
fastcall-with-one-stack-arg ABI plus the implicit EAX output."""
