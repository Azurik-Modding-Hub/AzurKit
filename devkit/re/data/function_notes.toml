player_walk_state = """\
Main walking-state per-frame function (state 0).  Real ABI: EAX = entity, [esp+4] = input, returns AL, RET 4 (4 call \
sites push one argument and never clean up).  Declared __stdcall(4); call it through \
``player_walk_state_call(entity, input)``, which also loads EAX.  Reads CritterData.run_speed * entity.magnitude * \
direction and produces horizontal velocity.  The FLD [EAX+0x40] at VA 0x85F65 reads garret4's config.xbr runSpeed, \
the cell walk_speed_scale sets (D53)."""
player_jump_init = """\
Initial jump from ground (state 5 -> 2 transition).  Real ABI: ESI = entity, EAX = input, returns AL, plain RET with \
no stack arguments, so it is declared __cdecl(void); call it through ``player_jump_init_call(entity, input)``, which \
loads ESI and EAX.  Sets entity.air_control=9.0 (imm32 at 0x890E4/0x89120) and entity.jump_height=1.1 (imm32 at \
0x890D4/0x89110), then computes v0 = sqrt(2*gravity*jump_height).  The FLD [0x001980A8] at VA 0x89160 is the \
jump_speed_scale patch target.  Calls player_airborne_reinit on the air-power path (overwrites \
air_control/jump_height with air-power-specific values)."""
player_airborne_tick = """\
Per-frame airborne physics (state 2).  Real ABI: EDI = entity, [esp+4] = input, returns AL, RET 4 (3 call sites push \
one argument and never clean up).  Declared __stdcall(4); call it through ``player_airborne_tick_call(entity, \
input)``, which also loads EDI.  Computes horizontal velocity = entity.air_control * entity.magnitude and applies \
gravity to z.  It does not call wing_flap: the state machine's air case (0x8D37A) does.  The FADD [0x001A25C0] at VA \
0x896EA was the pre-v2 flap_height_scale target (wrong maneuver — see comment there)."""
wing_flap = """\
Wing flap / Air-power double-jump.  Real ABI: ESI = entity, [esp+4] = input, returns AL, RET 4.  Declared \
__stdcall(4) for the stack part; ESI needs an asm thunk like ``player_walk_state_call`` (none is provided).  Its \
only direct caller is the state machine's air case (0x8D37A).  Gated by ([input_state+0x20] & 0x04) + \
armor.flap_count != 0 + entity.flap_counter < armor.flap_count.  Consumes fuel via consume_fuel: 1.0 on every flap \
(0x89354), and 100.0 more on a flap more than 6 m below the flap ceiling (peak_z + h - z > 6.0, the FCOMP at \
0x893C0; the CALL at 0x893D4).  v0 = sqrt(2 * 9.8 * flap_height) at VA 0x893AE (flap_height_scale patch target), \
halved by FMUL [0x001A2510]=0.5 at VA 0x893DD on that descent flap (flap_below_peak_scale patch target), scaled by \
FMUL [0x001A26C4]=1.5 at VA 0x893EB.  Also hosts the wing_flap_count shim trampoline at VA 0x89321."""
player_airborne_reinit = """\
Airborne re-initialiser, called only from player_jump_init (0x89147) and wing_flap (0x89348), not per frame.  ECX = \
&entity[+0x140] (air-control out), EAX = armor_mgr (in), plain RET.  Declared __fastcall(4) for ECX; EAX needs an \
asm thunk like ``player_walk_state_call`` (none is provided).  Writes entity.air_control (12.0 if the air slot's \
Flaps (level+0x38) is non-zero and its Level (level+0x08) is 1-3, else 9.0) and entity.jump_height (1.2 / 1.1 resp.) \
on every jump and flap.  This is WHY the static jump_init imm32 writes at 0x890E4/0x89126/etc. aren't enough to \
patch air-control — this function overrides them.  The 2 imm32s at VA 0x83FAC (12.0) and 0x83FCE (9.0) are the \
air_control_scale secondary patch targets."""
player_input_tick = """\
Per-frame input composer.  __fastcall(4): ECX = PlayerInputState pointer, plain RET (its one call site loads ECX and \
pushes nothing).  Reads raw stick/buttons, computes entity.magnitude ([entity+0x124]) and entity.direction \
([entity+0x128..0x130]).  When bit 0x40 of [entity+0x20] is set, multiplies magnitude by 3.0 at VA 0x849E4 (FMUL \
[0x001A25BC]): the developer cheat-buttons turbo, set only while the cvar 'enable cheat buttons' is on (0 in \
retail).  Not the roll (roll_speed_scale hooks 0x8C745)."""
player_climb_tick = """\
Climbing-state per-frame function (state 1).  Real ABI: EAX = entity, [esp+4] = input, RET 4 (its one call site \
pushes one argument).  Declared __stdcall(4); EAX needs an asm thunk like ``player_walk_state_call`` (none is \
provided).  Reads g_climb_speed_const (VA 0x001980E4 = 2.0) at two call sites: VA 0x87FA7 (primary climb velocity) \
and VA 0x88357 (secondary climb-retarget).  The constant has EXACTLY 2 readers (both here): the rung step (2.0 x dt \
a tick in xemu) and the rung clips' rate, which climb_speed_scale scales (Step 2.185)."""
player_slope_slide_tick = """\
Slope-slide states 3 & 4 per-frame function.  Called by the state machine's slope cases (0x8D250, 0x8D29A) and by \
0x8AE10, which sets state 3 first (0x8AEF4; the call is at 0x8AEFE); the ground attack starter 0x88A80 \
(``player_ground_land_tick``) never calls it [verified 2026-10-10, capstone].  State 3 uses the slope-slide constant \
(VA 0x001AAB68 = 2.0) — single reader at VA 0x89B76; overwriting it had no in-game effect (slider deleted in Step \
1.10, D18).  State 4 has separate fast-slide physics with dynamic-init globals at 0x003902A0..9C."""
player_swim_tick = """\
Swim per-frame function (state 6).  Real ABI: EAX = input, [esp+4] = entity, RET 4, result in AL (a non-zero AL ends \
the frame).  The state machine calls it from its ground, air, slope, zipline ride and swim cases (0x8D118, 0x8D35F, \
0x8D221, 0x8D26B, 0x8D2B5, 0x8D1CB), each with PUSH EBP (the entity) and MOV EAX, EDI (the input) [verified \
2026-10-11, capstone; live in xemu s6, ESI (from EAX) = the input, a stack address in 0x8C230's frame, and EBX = the \
entity].  Declared __stdcall(4); EAX needs an asm thunk like ``player_walk_state_call`` (none is provided).  It \
returns 0 at once while input+0x135 bit 0 is clear.  Reads [0x001A25B4]=10.0 (shared) at VA 0x8B7BF as the stroke, a \
target speed in m/s; the FMUL there is the swim_speed_scale patch target."""
fall_damage_dispatch = """\
Fall-damage tiered dispatcher (surface-landing path).  __stdcall(float fall_height, float fall_speed); it also reads \
EDI = the entity (0x8AD8C), an input the signature leaves out.  Called only from player_landing at VA 0x8C173.  \
Reads 7 cvars from config.xbr on first call ('fall min velocity', 'fall height 1/2/3', 'fall damage 1/2/3') cached \
as static doubles at 0x00390228..290.  The highest tier the drop reaches sets HP to HP - (int)'fall damage N' \
(0xF5A40, int32) through apply_damage (FUN_00044640), the clamped HP setter (0x8AD87-0x8AD9B); no armor code runs.  \
The deleted no_fall_damage pack (v2) rewrote the prologue to 'XOR AL,AL ; RET 8 ; NOP'."""
fall_death_dispatch = """\
Fall-death check.  __stdcall(int entity).  4 callers: player_landing at VA 0x8C095 when [entity+0x38] \
(surface-contact slot) is NULL (a contact with no floor object), player_jump_init (0x892A0), wing_flap (0x8945E) and \
0x856E2 (right after the fall reference's reset, so it can't kill).  A fall ending on a floor never reaches it.  \
When min(drop, v^2/2g) exceeds the cached 'fall height 4' (drop = entity+0x168, the fall reference, minus \
critter+0x164), it sets HP to 0 through apply_damage whatever the HP, plays 'fx/sound/player/fallingdeath' and sets \
the death flag ([entity+0x16C] |= 1).  The deleted no_fall_damage pack (v2) rewrote the prologue to 'XOR AL,AL ; RET \
4'."""
apply_damage = """\
Set a critter's HP, clamped to [0, max HP] (critter +0x210, +0x214); the name is old (a rename waits for AzurKit, \
D68).  __stdcall(int entity, int kind, char caller_flag) — verified by RET 0xC at VA 0x44735; the first argument is \
the critter, the second the new HP, not a kind (fall damage passes HP - damage).  14 direct calls (xbe calls), among \
them VA 0x8AD9B in fall_damage_dispatch and VA 0x8BF59 in fall_death_dispatch (the deleted no_fall_damage pack \
rewrote those two callers).  NOT directly patched — touching this shared routine would affect non-fall damage too."""
player_landing = """\
Player landing handler.  Dispatches to fall_death_dispatch (no-surface path, VA 0x8C095) or fall_damage_dispatch \
(surface path, VA 0x8C173) based on [entity+0x38] (surface-contact slot).  Called per-frame from \
player_airborne_tick's transition-to-ground logic."""
player_staff_wall_check = """\
The staff-hits-wall clank.  __stdcall(PlayerControl), RET 4 on all three returns; AL = 1 when the staff struck a \
wall this tick.  Only while the cvar 'combat/staff hits walls' (record 0x38BB80) is on and PlayerControl+0x94 has \
the attack bit 0x100, and while the body's ``m_attacklevel`` marker is raised (z > 0.01), it sweeps the staff bone \
``staff_center2slide`` against the world; a hit clears 0x100 and plays 'fx/sound/hits/clank1'.  A body without the \
bone sweeps stale stack bytes (X17, Step 2.75d).  One caller: the CALL at 0x8C3B0 in the PlayerControl tick \
(0x8C230), whose AL is ignored (0x8C3B5 moves EDI to ESI and calls 0x8C520) [verified 2026-10-12, Ghidra serve and \
capstone].  The player-model swap's X3 shim (Step 2.21c) takes that CALL and ends by calling this."""
consume_fuel = """\
Event-driven fuel consumer.  __thiscall(4): ECX = armor_mgr, float cost on the stack, popped by the callee (RET 4; \
both call sites push the cost and never clean up).  Subtracts cost / Flaps from the gauge ([this+0x24], 1.0 = full), \
where Flaps is the slot's flap cap ([[this+0x20]+0x38], 1/2/5 for air shields 1/2/3; there is no separate fuel_max).  \
Returns 0 only when there is no slot, Flaps is 0 or the gauge is exactly 0; when less than half a step is left it \
empties the gauge and calls armor_reset_out_of_fuel (0x837A0), still returning 1.  ONLY 2 direct callers — both in \
wing_flap (0x89354=1.0 cost, 0x893D4=100.0 penalty).  Per-frame sustained drain is SEPARATE, in \
player_armor_state_tick at VA 0x83DE3.  The deleted infinite_fuel pack forced this function to return 1 without \
consuming."""
settings_get_double = """\
Settings lookup, not a cvar getter (the name is an old misreading; the cvar system is cvar_get_or_create 0x9F630, \
docs/RE_XBE.md).  It reads one ``config/settings_foo`` cell by column (the setting's name, e.g. 'fall min \
velocity'), row ``Value``: while [0x1BF620] is 0, 0x5E550 loads the table there and the row index into [0x1BF624], \
and the value comes back on ST(0) from config_cell_value 0xD1520 [verified 2026-10-10, capstone].  Uses a \
caller-maintained cached-return pattern: caller keeps a static double + 'cached' byte, zeroes the byte on first \
call, and passes in ESI a record whose first DWORD points at the setting's name.  The arg-in-ESI is a Watcom-ish \
convention not expressible in portable C, so shims using this would need a wrapper."""
anim_apply_translation = """\
Per-frame animation-apply helper.  __thiscall: ECX = four floats copied to anim_obj[+0x18C] and normalised (a \
