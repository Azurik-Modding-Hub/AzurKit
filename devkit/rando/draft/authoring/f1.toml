# ---- the air-3 traverse over the cavern (the route's f1/g0/r1689 to f1/g0/r1695, [web] "f1 air 3"): from the Town_F1 ledge across the
# cavern's top ledges to the tunnel room Z013 and the obsidian ledge Z072. Its flights pass three flame spouts (timed:
# water 1, re-lit after it) whose derived destroy_from leaves out the takeoff ledges, so the derive drops those crossings.
[barrier."f1.flameSpout"]
destroy_from = ["f1.Z271"]
why = "doused with water 1 from the ledge the flight to Z118 leaves from, before the flight [inferred] (default taken under D115)"

[barrier."f1.flameSpout15"]
destroy_from = ["f1.Z033"]
why = "doused from the ledge the jump into the tunnel room (Z013) leaves from [inferred] (default taken under D115)"

[barrier."f1.flameSpout1"]
destroy_from = ["f1.Z013"]
why = "doused from the tunnel room before the flap to the obsidian ledge Z072 [inferred] (default taken under D115)"

