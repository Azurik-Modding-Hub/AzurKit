[[edge]]                      # the owner's way from the bay onto the fallen tower (Step R1.8j)
from = "w1.Z001"
to = "w1.Z034"
requires = "event:w1.torpedo_tower.toppled"
why = "the owner (2026-10-14), of the fallen tower reached from the bay: \"Climb out of the water onto it\"; then along it into the dark cave (walked 3 of 3 in sitting r18h from its bay end). Not reproduced: the tower lies with its low end in the bay (its underside 2.4 m under the water) and its top 1.2 m (a 45-degree face that slides) to 2.0 m over the water at that end; a swimmer floats with the feet 1.2 m under the surface and leaves the water only onto floor near it (xemu r18j: 13 tries at three faces, swimming, rising, Y, a dive and a wade, none out of the water onto it; rows climb-*, climb45*, wade-climb-1, sand-climb-*, swimjump-*); the slope beside the low end is walked onto from the water, but L3 runs from there (a running jump at the low faces, no air and air 1; and Go-Explore, 3 seeds of 120,000 steps each with air 0 and air 1) found no way onto the top (inconclusive: the step budget, a file read). The owner played it (D215, X.28 spot 3: \"no skips were needed except for going through the dark cave without any fire power\"): from the bay by the tower's base end (spot3-w1-tower: the tower toppled by R1.8h's torpedo solver, placed; kit 0) onto the fallen tower, along it to its top end at the cave (w1.Z034) and on to the obsidian (n 67333) and W1_Town, fire 0, no flap, no key [verified xemu, the owner's real input: the owner's X.28 demos' per-tick trace (2026-10-15), n 66210-67799]; replayed tick by tick from the same state on the deterministic sandbox (the trace's pad written at each player update) it reached the tower's top end at the cave within 0.001 m of the owner's run (tick 432, n 66642; R1.8q's REPORT). The edge needs no air: with it the bay -> dark cave term no longer carries the derive's air 1"

