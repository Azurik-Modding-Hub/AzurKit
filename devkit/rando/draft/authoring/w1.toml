[[edge]]                      # the underwater station: a dive to its moon pool, then in through the ElectricArch (AZ-391)
from = "w1.Z001"
to = "w1.Z090"
requires = "air>=1 & fire>=1 | skip:w1.pstorage_electric_arch"
why = "a dive from the bay to the underwater station; the derive models no way down its 83 m of water. D158 walk (sitting r18c): the dive reaches the station's outer wall, 13.5 m over the water keylock's floor w1.Z090 (HP 200) [verified xemu, placed]. The station is a sealed air pocket whose only opening is the ElectricArch (D145's solid-free connectivity: with the arch's TriggerShape shut the inside is its own component) [verified data]; outside it a porch over the moon pool, inside the hall where the water keylock stands 7 m behind the arch (w1.Z090, on the porch's level), whose stairs (timer45: the derive's rig edges w1.Z090 -> w1.Z806 gated by button:w1.water_keylock) rise to the upper floor and the periscope (w1.Z026), so the torpedo needs the keylock (AZ-344). The arch (gameState1: armor type 6, level >= 1, so the lightning shield, air 1 + fire 1) holds the player both ways: in L3 (whole steps, x15g-w1-k0, placed 3-4 m from the arch, then the pad only: a walk and a walk with jumps) nothing and the air shield are thrown back (HP 200 -> 155 / 159-167) from the porch and from the hall alike, and the lightning shield (air 1 + fire 1, cast LT+Y+B) walks through both ways with no HP lost [verified L3: Step R1.8p's w1 station report (2026-10-15)]; a stored lightning shield passes it too (w1.pstorage_electric_arch, skips-c E5b), and the skip enters as well: the store is carried with LT held down the dive (at element level 0 each A and X press only sets the mask's 0x40) along the side tunnel and up the moon pool's shaft onto the porch, and let go there it casts the shield, TriggerShape #1531 goes non-solid and the walk stands in the hall (Step R1.38, AZ-811, D210: rows S1 and S2, kit 0/0/0/0, real input from the bay's surface, HP 200; the control with no store thrown back, HP 200 -> 125) [verified xemu, placed at the sea surface: Step R1.38's w1 sitting (2026-10-28)]; at every kit tried, by real input from a bay save's load (w1's save platform w1_1 lies in this zone; W1_3's beach has no kit-0 way here), with one procedure: where earth or water is 1+ the dive's A and the shaft's X also select that element (each press with LT held flips it), and let go so the store casts a staff and the arch throws you back, so before letting go one more A or X tap leaves only air and fire selected (Step R1.38b, AZ-816: kits 0/0/0/0, earth 1, water 1, earth/air/fire/water 3/3/0/3 and 3/0/3/3, each control thrown back) [verified xemu, placed save: Step R1.38b's arch kits sitting (2026-10-28)]. The key rule (AZ-345) lets the keylock open with the bay keylord's key, since life's two key_life1 lie in life ahead of its two locks (Step R1.8l)"

[[edge]]
from = "w1.Z090"
to = "w1.Z001"
requires = "air>=1 & fire>=1 | skip:w1.pstorage_electric_arch"
why = "out of the station: through the ElectricArch onto the porch, down into the moon pool and up into the bay, the dive's way swum up (Step R1.38's S1, with the stored shield cast on the porch: out through the arch, the swim in the pool dropped the shield, then down the shaft, along the tunnel and up to the bay's surface, HP 200) [verified xemu]. The owner (D210, 2026-10-15): leaving the station needs the electric shield, or the stored one (power storage); in L3 the lightning shield walks from the hall through the arch and drops into the moon pool, while nothing and the air shield are thrown back [verified L3: Step R1.8p's w1 station report (2026-10-15)] (AZ-391). The inside comes down to the hall (the derive's w1.Z026 -> w1.Z090)"

