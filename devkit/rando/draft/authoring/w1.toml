[exit."w1/g0/r3352"]          # W1_W2_Fall: the water spout's ride; its arrival spot W1_W2_Fall is over w2's hose pool
from = "w1.Z169"
to = "w2.Z003"
why = "the owner (2026-10-14): 'for getting to w2 from w1, we are supposed to jump into a water spout by going along the rocks above the water'. The spout is SpoutPush1Shape, a push volume (pushZ 150 along its axis, 29 deg off vertical, 84 m long) rising out of the water beside the beach, switched by water_spout_particles_timer3 (on 0.67-4 s of every 8 s, repeating; touching it or HoverShape makes BlockerShape, a cylinder on the same axis, solid) [verified static: logic_dump.py w1 '^SpoutPush1Shape$']; the rock w1.Z169 (4-10 m over the water) stands in its foot (124 walk samples with the body inside it, the only zone that has any) [verified data]. Its push hands the body to a chain of push cylinders (pCylinderShape68-73, pushZ 100; 85, 50; 86, 20) whose axes follow an arc about 460 m long, rising then falling, that ends about 370 m away; the last, pCylinderShape86, lies inside pCubeShape327, W1_W2_Fall's touch trigger (which also covers w1.Z032, inside 86, and 89 samples of w1.Z005, the zone the derive anchored the exit to) [verified data: the volumes' meshes]. So the exit is taken from the rock in the spout's foot, not from Z005 (R1.8's hand edge beach -> Z005 is gone). The ride, played: from Z169 an L3 string in whole steps (the spout's timer is scene-side) walks onto the spout's foot and jumps every 8 ticks; the spout lifts the body 179 m along the cylinders into the trigger at tick 156 (robustness 1.0), replayed in xemu tick for tick, and w2 loaded [verified xemu: Step X.15's L3 coverage run (2026-10-14), sitting x15a]"

[[edge]]                      # the rocks above the water: from the beach onto the big rock Z027 (then Z066 and the ridge Z048 to the spout's rock)
from = "w1.Z004"
to = "w1.Z027"
requires = "true"
why = "the owner's way to the spout (2026-10-14: 'going along the rocks above the water'): the rocks Z027 (13-24 m over the water), Z066 (10-13 m) and the ridge Z048 (9-11 m), which runs about 50 m out to the spout, where a jump drops 4.7 m onto the spout's rock Z169; the derive models every hop after the first (Z027 -> Z066 drop and jump, Z066 -> Z048 jump, Z048 -> Z169 jump) but the first only as a flap (air 1): Z027's rim is 1.26 m over the beach 4.9 m away, 0.42 m over the plain running jump's arc there [verified data: the walk samples], inside the measured lip lift (a running jump mounts up to 0.4987 m over its apex, RE_MOVEMENT); from a new game on the beach (vanilla-rz-new) an L3 string of 474 ticks (robustness 0.94 under jitter) lands on Z027 by the step-up and replayed in xemu tick for tick, and the chain then went on along the rocks and through the spout into w2 [verified xemu: Step X.15's L3 coverage run (2026-10-14), sitting x15a, its w1 opening chains]"

