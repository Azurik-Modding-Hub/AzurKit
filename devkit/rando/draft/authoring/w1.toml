[[event]]                     # the periscope's joystick: the torpedo (AZ-344)
id = "w1.pCubeShape7.joystick"
zone = "w1.Z806"
requires = "button:w1.water_keylock"
why = "the periscope stands at the top of the underwater station's spiral stairs (walked in sitting r18c with nothing), but the station's upper floor is entered only from its hall, behind the ElectricArch (AZ-391), up the water keylock's stairs (timer45), and the keylock takes the key_life1 the bay's keylord drops; its joystick also needs the station's two overlords killed (andCombiner5) [verified static: logic_dump.py w1]. The keylock is the torpedo's requirement (Step R1.8l: the key rule, AZ-345, opens it with the bay key alone, life's two key_life1 lying in life ahead of its two locks)"

[[event]]                     # the torpedo topples the tower into the dark cave's mouth (Step R1.8h)
id = "w1.torpedo_tower.toppled"
zone = "w1.Z806"
requires = "event:w1.pCubeShape7.joystick"
why = "the owner (2026-10-13): aim the torpedo toward the dark cave to hit the tower beside it, which topples into the cave and opens its entrance. The wiring: the joystick's stick x sets PeriscopeTimer's rate (0.1 x the stick; a 4 s cycle turns the periscope's Camera a full turn); getting off the joystick launches the torpedo (CombineToggle & nandCombiner1 -> andCombiner1 -> LaunchToggle: Tor1 flies it, Tor2 times it); it blows up where maxCombiner1's bearing curve (the distance along the periscope's heading, against Tor2 x 15) says it hits (ExplodeToggle); StatueCombiner ANDs the blast with StatueRotToggle, on while the periscope points within a 2-degree window at the tower; StatueToggle (lock, saved) runs StatueTimer (saved), which topples the tower (StatueAnim) and clears the wall in front of the cave 3 s in. A miss: ExplodeTimer resets the periscope 24 s after the blast, so the torpedo is fired again (no lockout) [verified static: $RP r0/tools/logic_dump.py w1 '^(StatueRotToggle|maxCombiner1|StatueCombiner|ExplodeTimer)$' and the curves of their links]. No item aims it; the joystick event carries the station's overlords and the water keylock (AZ-344). Sitting r18h (2026-10-13; runs torpedo-1..3): scripts/xemu_minigames.py's torpedo solver turned the periscope into the window and fired, and the tower fell at the first launch 3 of 3, the wall's three solids off after [verified xemu, placed: PeriscopeHelpToggle latched for the overlords, the player put on the periscope's platform]"
