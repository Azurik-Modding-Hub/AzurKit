# a1's hand decisions for `azurik-mod rando author` (Step R1.11a): what the derive (derived/a1.json.gz) can't decode
# or doesn't model. Zones are the derive's (a1.Z<n>); a default taken under D115 says so.
#
# The realm's conservative-kit rule (default taken under D115): a pool location the derive places on no floor or
# reaches in no rung (a moving rig, a rotating ring, a flower) is joined to a node it is reached from, and requires
# the elements the vanilla run holds when route.toml collects it (a location off the route: when the run last leaves
# the level). That kit is enough by construction (the vanilla run collects it with it), so the logic never asks for
# less than the game needs; the xemu probe sitting (sitting r111a, 2026-10-13) owes the exact mechanism.
level = "a1"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

[names]
a1_tree_top = "a1.Z013"       # the E6_A1 and A6_A1 arrivals at the top of Tree_elev3's ride (+403 m), the three air keylocks and the Vac1-3 tubes' feet
a1_seal = "a1.Z003"           # the air seal (DiscTrigga_Life) and BridgeShape2
a1_save = "a1.Z167"           # the save platform a1_1, where the Flower teleports land

