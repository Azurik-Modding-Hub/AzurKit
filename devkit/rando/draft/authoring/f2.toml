# f2's hand decisions for `azurik-mod rando author` (Step R1.11b's draft, finished at Step R1.8d). Zones are the
# derive's (f2.Z<n>); a default taken under D115 says so.
#
# The derive follows f2 no further than its entrance pocket (12 zones round the E5_F2 arrival, f2.Z003): the way on
# is the lava-pipe switch chain, whose effects are rides it decodes but gives no edges (the drill, Drill1CamTimer and
# Drill1StuffTimer1 from the pCylinderShape61 / pCylinder61b actions; the geyser lids lava_plat1-7; the steam vents
# pCylinderShape51/62, switched by pCylinderShape50f's touch; the lava pipe that raises the air power, [video:
# deOODDGOQFQ@52:23-55:00]), and the silver teleporter, whose far end (ResetShape2, f2.Z000) must be touched first.
# So f2 takes the conservative-kit rule (RANDOMIZER_DB 4.10, a1's precedent; default taken under D115): every pool
# location the derive doesn't join to the arrival both ways is taken from the arrival and requires the elements the
# vanilla run holds when route.toml collects it (off the route: at f2's last route step), and the exits to f4 leave
# from the arrival with the kit the run holds when it goes there. The run collects each with that kit, so the logic
# never asks for less than the game needs; the realm's probe sitting owes the switch chain.
level = "f2"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list), and sweep (curved jumps the straight-flight check misses) at its own tier, as f1 and f3 admit it: the entrance pocket's ways about are such jumps (default taken under D115)

[rig_one_way]                 # AZ-589 (Step R1.24a, D719): rigs whose movers only rise or only sink; their guessed rides against it stay out of logic
Drill_pCylinderShape14 = { way = "down", why = "Drill1StuffTimer1, a timer that doesn't repeat, only lowers it (every decoded ride goes down): no ride carries the player up on it, so its 36 guessed rides up are held [verified data: Step X.53's read of the guessed rides (2026-10-21), the reach model's decoded rides]" }

[names]                       # node id -> one of its zones
f2_entrance = "f2.Z003"       # the F2_E5 switch (levelSwitch1 -> e5) and TeleLocator1: where e5's levelSwitch3 lands (E5_F2, a spot the derive places on no floor; the probes sitting stood it 8.7 m from F2_E5 [verified xemu, the probes sitting's one-way exits (2026-10-12)])
f2_core = "f2.Z056"           # the ledge by power_air (f2/g0/r1831; taken from the arrival, below), named for tricks.toml's f2.pstorage_air_flap
f2_life_frag = "f2.Z007"      # frag_life_3 behind AcidBlock_04 (taken from the arrival, below), named for tricks.toml's f2.acidblock04_fly_around
f2_f4_side = "f2.Z001"        # the F4_F2 arrival and the levelSwitch3 -> f4 switch

