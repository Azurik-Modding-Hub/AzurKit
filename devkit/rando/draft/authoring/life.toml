zone = "life.Z002"
requires = "event:life.final_joystick.armed"
why = "the final joystick's minigame [verified data: $RP r0/tools/logic_dump.py life '^(Xnor1|t1|s1|FinalMovieCombiner|BeamToggle|MovieTimer|andCombiner[235]|CrashToggle|LightResetToggle|ResetCombiner)$']: the stick steers the pilot ball (StearingTimer1, SpeedTimer) through the 20 filament cores (pSinks s1-s20 latch t1-t20), and all 20 (andCombiner2 & andCombiner3 -> FinalMovieCombiner) turn BeamToggle on (saved: the beam exits below) and run MovieTimer, which after 24 s takes away the solid ball (pSphereShape25/26, 3.5 m) that holds frag_life_4 on the pad [verified data: the fragment's generator point is inside the ball's mesh]. A touch of a stabilizer stream (pBoxSinks b1-b12), or letting go of the joystick, resets every core (ResetCombiner -> LightResetToggle) and greys the joystick for 5 s (CrashToggle, Xnor1); it is played again: no lockout. It needs nothing past the armed joystick: won with kit 0 too, then the beam's exit taken (Step R1.8n, cores-k0-1). Won in xemu (Step R1.8f, sitting r18f's runs (2026-10-13): cores-live-3, cores-live-4; Minigames.cores, real stick input, three crashes on the way): all 20 cores, BeamToggle on, MovieTimer ran out and the joystick let go; the walk on toward the fragment then ended in town (cores-reward-2; most likely the beam's field, the r1692 exit)"

[exit."life/g0/r1692"]        # Movie_levelSwitch: the beam field touched while the life disc is not placed
from = "life.Z002"
requires = "event:life.filament_cores.won"
why = "and(nand(life_disk_placed), touch(ToTownFieldShape) after timer43, BeamToggle) [verified data]: the beam's field once the filament-core minigame is won (BeamToggle; life.filament_cores.won); with Town_levelSwitch exactly one of the two is armed, so each carries the same requirement (default taken under D115)"

[exit."life/g0/r1707"]        # Town_levelSwitch: the same field once the life disc is placed
from = "life.Z002"
requires = "event:life.filament_cores.won"
why = "and(life_disk_placed, touch(ToTownFieldShape) after timer43, BeamToggle) [verified data]; as Movie_levelSwitch"

