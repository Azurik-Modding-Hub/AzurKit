from = "life.Z002"
to = "life.Z013"
requires = "air>=2"
why = "the arrival to Lock_B (the north keylock, life_keylock r200): the spiral from the arrival, the south bottom switch (X), its lower ramp and the north approach to the keylock tier; no power and no flap [verified xemu, the owner's real input: the owner's X.28 demos' per-tick trace (2026-10-15) spot 5, n 88244-91061, kit 0; spot 1's retry reached the keylock tier at kit 0 too, n 11613-13458]. The edge asks air 2, the keys' own need, though the climb needs none: the key rule (AZ-345) gives a key spent here back only when a key of its type lies on every way to the lock, and life's two keys need air 2, so without it a player at kit 0 could spend the bay keylord's key on this lock and w1's water keylock would count three keys (the vanilla run fails). Keys are vanilla in v1 (a lock here is used only with a key, and life's own need air 2), so it costs no seed anything (default taken under D115)"

