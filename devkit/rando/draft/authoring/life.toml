# life's hand decisions for `azurik-mod rando author` (Step R1.11d): what the derive (derived/life.json.gz) can't decode
# or doesn't model. Zones are the derive's (life.Z<n>); a default taken under D115 says so. life is the Life realm's
# tower: the two keylocks turn the big arms on (life_keylock1 -> xorCombiner1 -> BigArmToggle2, life_keylock ->
# xorCombiner2 -> BigArmToggle1), the arms and the bottom switches' ramps (ArmToggle1/2) lead up to the two top
# switches (FinalSwitch1/2_toggle, pressed at pads A and B), whose goals arm the final joystick
# (FinalJoystickActivateCombiner -> JoysticPadTimer), and the beam puzzle's 20 particle sinks (FinalMovieCombiner)
# arm both exits' push field (BeamToggle) [verified data: logic_dump life]. The derive places 68 of the 78 pool
# locations on no floor (the ramps, arms, rings and key stands are switch-driven solids and rigs it doesn't follow),
# reaches none of the locks, pads or the top ring from the arrival, and decodes neither exit.
#
# The owner's demos (Step R1.8q; D205, D209): the climb from the arrival to the keylocks, the keylocks, the middle
# ramps to the top switches, the top ramp, the jump onto the minigame's lowered pad, the minigame and the beam exit need
# no power, and the two keys need air 2 (at most 2 flaps a flight, D183) [verified xemu, the owner's real input:
# the owner's X.27 demo's per-tick trace (2026-10-15), the owner's X.28 demos' per-tick trace (2026-10-15) spots 1 and 5; R1.8n's kit-0
# minigame win and exit]. The way to the two keylocks asks the keys' air 2 all the same, so the key rule (AZ-345) still
# finds a key on every way to them (the arrival's edges below). What no demo showed keeps the conservative-kit rule (draft/authoring/a1.toml's header,
# default taken under D115): joined to the arrival's node, it requires the elements the vanilla run holds at life (air,
# water, fire, earth 3: the route's button:town.seal to life/g0/r259): the gems the derive places nowhere and frag_life_4 (the crown deck's way
# up was never shown). The pads stand in for the keylocks where a confirmed skip goes past one
# (life.rjump_second_switch).
level = "life"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "lip"]   # R1.8's list without rig and sweep (default taken under D115): the tower's ramps, arms and rings are switch-driven solids and rigs the derive sees as gaps, so its curved-path and ride guesses are unsafe here (it admits the ring-to-pad-B drop at standard, which kills without the confirmed skip's air 3: rjc5 A6)

[rig_requires.PlatShape]      # the final joystick's pad (Step X.16)
requires = "event:life.BlockerShape_g0r243.action & event:life.Blocker2Shape.action"
why = "JoysticPadTimer, PlatShape's only mover, is enabled by FinalJoystickActivateCombiner alone, an and of FinalSwitch1_toggle.goal and FinalSwitch2_toggle.goal (the top switches at pads A and B) [verified data: logic_dump.py life '^(JoysticPadTimer|FinalJoystickActivateCombiner)$']: the pad moves only once both are pressed, so the derive's guessed ride from the arrival (39.5 m up, then on by curved flights to Lock_B) needs both; no power (the owner's jump from the top ring onto the lowered pad, kit 0, 0 flaps: X.28 spot5-prepad, D209; the pad's range is not decoded). Without it, once AZ-359's slides joined the big arms' sides, R_phys reached Lock_B from the arrival with air 3 alone and the key rule (AZ-345) stopped giving key_life1 r334 back"

[names]
life_core = "life.Z002"      # the arrival (startspot and Town_Life) [verified xemu, placed: sitting r111d], the save arch L1_1, the joystick pad (PlatShape)
life_lock_a = "life.Z012"     # Lock_A: keylock r30 (life_keylock1)
life_lock_b = "life.Z013"     # Lock_B: keylock r200 (life_keylock)
life_pad_a = "life.Z011"      # TopSwitch_A: FinalSwitch1 (BlockerShape g0r243's action button)
life_pad_b = "life.Z010"      # TopSwitch_B: FinalSwitch2 (Blocker2Shape's action button), the skip's landing
life_ring = "life.Z001"       # FinalJoystick on the top ring, the skip's takeoff (rjump-locate life.rjump_second_switch)

[[edge]]
from = "life.Z002"
to = "life.Z012"
requires = "air>=2"
why = "the arrival to Lock_A (the south keylock, life_keylock1): up the spiral from the arrival to a bottom switch, which swings its lower ramp out to the keylock tier; no power. The owner (D209, X.28): \"you can get to the top switches that require the keys with no powers\" and \"we can definitely insert the keys and do each side and get to the top with no powers and just the 2 keys\"; the north side was played with kit 0 (the Lock_B edge), this side's keylock was placed in X.28 spot5-prepad, not pressed for real (the owner's word stands for it, default taken under D115). The edge asks air 2, the keys' own need, though the climb needs none: the key rule (AZ-345) gives a key spent here back only when a key of its type lies on every way to the lock, and life's two keys need air 2, so without it a player at kit 0 could spend the bay keylord's key on this lock and w1's water keylock would count three keys (the vanilla run fails). Keys are vanilla in v1 (a lock here is used only with a key, and life's own need air 2), so it costs no seed anything (default taken under D115)"

