[gates]
# The hose minigame (Step R1.8f) [verified data: $RP r0/tools/logic_dump.py w2 '^(OpenNCloseToggle(3|1[1-5])|HoseStuff:.*|LightShape)$']:
# the console's action button (LightShape, X) latches HoseStuff:toggle10 and turns the hose on (keyToggle); the joystick
# (PublicJoystickShape) aims its nozzle (damper1/2: the stick's deflection is the angle, up to 72 deg) and its range
# (pEmitterShape2.velocityBaseZ); water sinking into a fire's HoseSink1Shape opens that fire's OpenNCloseToggle for about
# 8 s (on over 4 s, off over 4 s; stored turnOff); hosecombiner ANDs the six fires (fire4, fire12-16), so all six put out
# at once latch hosetoggle (saved), which drops the blocker and the damage round the power (nandCombiner1). No item
# starts or aims the hose; a fire that relights is put out again, so a miss is retried (no lockout). Touching the
# altar's trigger then plays the power's cutscene (WaterPowerTimer, saved), which turns the hose off for good.
# Its two stations stand 95 m apart, both high over the pool (Step R1.8o, AZ-375): the console on w2.Z070, the round
# platform at the far end of bridge01 from the south ridge (w2.Z077), and the joystick at the north end of the
# fountain path (w2.Z022). So the gate asks for the minigame's two events, credited there (the [[event]]s below); the
# way to them from the pool with nothing is the bridges' hand edges and the walks proven below.
"w2.gate.nandCombiner1" = "event:w2.hose.won"   # the hose blocker round power_water: the hose minigame above, played at its console and its joystick (no item)

