# No edge up the ice cave's stairs (AZ-350, Step R1.8k): they are a 39 m ramp of slippery ice (w2.Z507, 0x8051 over its
# whole length, nz 0.90-0.99, no flat landing). R1.8c's hand edge w2.Z006 -> w2.Z022 ("true", from the phys profile's
# 0.65 m step-up) slid back about 12 m up in xemu (sitting r18e) and in L3: walked up the fall line from the plaza the
# body slides (state 3) and gains at most 3.2 m, a jump every 12 or 20 ticks at most 3.6 m, and on w2's slippery floors
# a 3 s walk uphill gains at most 0.4 m in every slope band from nz 0.90 to 0.9995 [verified L3, x7-w2-k0:
# Step R1.8k's w2 town report (2026-10-14)]. The ramp's own walk in the derive is AZ-359; r1357's requirement is below.

# The vanilla way to the hose's stations from the pool, with nothing (Step R1.8o, AZ-375): out of the pool onto the
# plaza and up its ramp to the upper ledge (w2.Z006), bridge07 to WaterfallView (w2.Z020), up the climbable face there
# (the derive's climb, 16 m, to the south ridge's end w2.Z077), then bridge01 to the console, or the derive's jumps
# along the ridge (w2.Z023) and down onto the fountain path (w2.Z022) to the joystick, past the enemies there [verified
# L3: whole steps from the W1_W2_Fall arrival, kit 0: Step R1.8o's w2 hose report (2026-10-15)]. The derive cuts both
# rope bridges: each deck is a pair of invisible solid boxes (pCubeShape389/390) that BounceTimer rocks about the
# bridge's long axis, a rig whose movers don't lift it level, so it keeps no floor and the zones at its two ends have
# no walk between them. Help dialogs at WaterfallView and at the console pause the game until A.
