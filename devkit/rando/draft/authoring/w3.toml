# ---- the ice-bridge and snow puzzle (decoded wiring: logic_dump.py w3, Toggle_Build_Bridge_1/2, AND_Snow1/2, andComb)
# Bridge 2 (ICEBREIDGE, the E island <-> the centre's top) = Toggle_Water_2 (LightShape g1r23, NW spiral top, latches: no
# off input) AND Toggle_Button_2 (LightShape g1r29, E island); the derive decodes it (gate w3.gate.Toggle_Build_Bridge_2).
# Snowplat2 (Toggle_Snow_Visible_1, latches once on) = Toggle_Snow_Blowers AND Toggle_Water_2 AND bridge 2; the blowers
# = IceBlock_014 melted at steam level 2 (IceMelt_toggle's magic curve: on at 2) AND Light1Shape pressed (andComb, the
# frost switch beside IceBlock_014). Snowplat1 (Toggle_Snow_Visible_2) = the blowers AND Toggle_Water_1 AND bridge 1.
[gates]
"w3.gate.Toggle_Snow_Visible_1" = "event:w3.snow_blowers.on & event:w3.LightShape_g1r23.action & event:w3.LightShape_g1r29.action"
"w3.gate.Toggle_Snow_Visible_2" = "event:w3.snow_blowers.on & event:w3.LightShape_g1r93.action & event:w3.LightShape_g1r98.action"

[[event]]
id = "w3.snow_blowers.on"
zone = "w3.Z400"
requires = "flag:w3.IceBlock_014.destroyed"
why = "the frost switch: Light1Shape (beside IceBlock_014, on w3.Z400) turns the snow blowers on once IceBlock_014 is melted at steam level 2 (andComb's two inputs; the blowers are a toggle, taken as latched since a second press only turns them off, default taken under D115)"

