# d2's hand decisions for `azurik-mod rando author` (Step R1.11d): what the derive (derived/d2.json.gz) can't decode or
# doesn't model. Zones are the derive's (d2.Z<n>); a default taken under D115 says so. d2 is the Death realm's
# laboratory under d1: the bridge-end cutscene (d1's D2_movie_levelSwitch) drops the player from D1_D2_Fall onto the
# lab floor d2.Z015, alive [verified xemu, placed: sitting r111d], beside the save point D2_1 (d2.Z026), the six key_lens open the six lens keylocks in the lock room
# (d2.Z008), and once all six are used the force field to the door (key_plusCombiner_damper) opens onto the
# D1_D2/D2_D1 door pair (d2.Z135) back to d1's floor 1 [verified data: logic_dump d2; the fall's landing inferred from
# the height below the spot, the sitting's arrival probe owes it]. The derive models no way back up from the lab floor
# (the conveyors, scoops and lifts are rigs it doesn't follow), so every pool location but one takes the
# conservative-kit rule (draft/authoring/a1.toml's header): joined to the arrival's node with the elements the vanilla
# run holds in d2 (air, water, fire, earth 3: the route's d2/g0/r3045 to button:d2.death_keylock5). D123: d2's three vat gems (r3774, r3777, r3780)
# are normal pool spots, with no exclude or farmable.
level = "d2"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

