d2_core = "d2.Z015"           # the D1_D2_Fall landing [verified xemu, placed: sitting r111d], beside the save point D2_1 (d2.Z026)
d2_lock_room = "d2.Z008"      # the six lens keylocks
d2_door = "d2.Z135"           # the D1_D2 arrival and the D2_D1 door back to d1

[[edge]]                      # the force field (key_plusCombiner_damper) and the door between the lock room and the door pair
from = "d2.Z008"
to = "d2.Z135"
requires = "button:d2.death_keylock & button:d2.death_keylock1 & button:d2.death_keylock2 & button:d2.death_keylock3 & button:d2.death_keylock4 & button:d2.death_keylock5"
why = "the force field to the door is solid until Keys_plusCombiner reaches 6 (ForceFieldShape.gameSolid's step at 5.5) [verified data]; that it sums the six lens LockToggles is [inferred] from its name and the six locks; the derive writes the field false (its combiner undecoded); the door beyond opens on its field's touch [verified data]"

[[edge]]
from = "d2.Z135"
to = "d2.Z008"
requires = "button:d2.death_keylock & button:d2.death_keylock1 & button:d2.death_keylock2 & button:d2.death_keylock3 & button:d2.death_keylock4 & button:d2.death_keylock5"
why = "the same field and door from the door's side"

[[edge]]
from = "d2.Z015"
to = "d2.Z008"
requires = "air>=3 & water>=3 & fire>=3 & earth>=3"
why = "from the lab floor up to the lock room: the derive models no way up (the conveyors, scoops and lifts); the conservative-kit rule's kit at the route's button:d2.death_keylock (default taken under D115)"

[[edge]]
from = "d2.Z008"
to = "d2.Z015"
requires = "air>=3 & water>=3 & fire>=3 & earth>=3"
why = "from the lock room back down into the lab, as the way up (default taken under D115)"

[exit."d2/g0/r3840"]          # D2_D1_levelSwitch: the door field beside the D1_D2 arrival
from = "d2.Z135"
requires = "button:d2.death_keylock & button:d2.death_keylock1 & button:d2.death_keylock2 & button:d2.death_keylock3 & button:d2.death_keylock4 & button:d2.death_keylock5"
why = "Step R1.24b (D722, the owner's demo, X.78): going back into d1 by this door needs the death keys (the owner, verbatim: \"you cant go back into d1 without the keys\", which: \"d1's death keys\"); the door's wiring holds no keylock (touch(DeathLevelTransition1:LevelDoor2:public_DoorFieldShape) fires D2_D1_levelSwitch, and the iris toggle has no input in d2 [verified data: logic_dump.py d2]), and d1's three death keylocks are used after this door (the route's button:d1.death_keylock to button:d1.death_keylock2): gating it on any of them leaves the vanilla placement unbeatable (71 locations and the victory lost, Step R1.24b's read of the vanilla placement with this door gated), so it asks the death keylocks of d2's lock room, the six lens keylocks the vanilla route uses before it (button:d2.death_keylock to button:d2.death_keylock5; default taken under D115). touch(DeathLevelTransition1:LevelDoor2:public_DoorFieldShape) [verified data]"

