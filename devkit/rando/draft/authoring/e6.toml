[[event]]                     # the red machine: its gravity lifts up to the second level (Step R1.8i, AZ-355)
id = "e6.red_machine.on"
zone = "e6.Z001"
requires = "event:e6.Light4Shape.joystick & event:e6.Light6Shape.joystick"
why = "RedOnToggle (stored turnOff: on while RedMachineCombiner is) needs all three red orbs lit (RedPanel_Toggle4-6 -> andCombiner10 -> RedPanelDelay_Toggle1 -> RedMachine_Toggle1-3 -> RedMachineCombiner); it opens Red_Machine's and Red_Machine2's iris (Door1-6.rotateX) and turns on their push fields (Public_FieldShape1, pushZ 4, 31 m tall), the lifts to the upper ring. Each spotlight aims at one of two orbs (its Left/RightPanelCombiner windows on its Public_RotY/RotZ timers): Light1 red 5 or red 6, Light2 red 4 or blue 8, Light3 blue 9 or blue 7, Light4 red 6 or red 5, Light5 red 4 or red 5, Light6 blue 7 or red 6; Light2, 4 and 6 stand on the lower ring (10 m under the upper ring's three), so from below the red machine is lit one way only: Light2 on red 4, Light4 on red 5, Light6 on red 6 [verified data: $RP r0/tools/logic_dump.py e6 '^(RedOnToggle|RedMachineCombiner|(Left|Right)PanelCombiner[0-9]*|MirrorAngleCombiner[0-9]|BlueMirrorAngleCombiner2)$' --hops 1]. Light2's pad is in the garden's node (e6.Z001), Light4's and Light6's are their islands' (the events above). No item aims a light. Sitting r18i (2026-10-14; runs red-first, full-1, full-2, module-2, module-3): those three aims lit the red machine 5 of 5, and its lift carried the player 32 m up from its floor (e6.Z120) on every ride (7, about 220 ticks) and, steered at the top, onto the upper ring 4 of 4 (rows lift-1726-jump, way-in-1, way-in-2, module-way-in-4; the red machine's camera holds the stick for about 20 s after it comes on) [verified xemu, placed: R6 onto each pad and onto the lift's floor, which the route pilot found no way onto from the garden]; the owner rode a red lift from the garden up to the ring with no power and no flap (D217: \"both red lifts lead to the second level ... reaching them from the garden is trivial\"; X.28 spot 4, n 74097-75600 at kit E3 A3 F3 W3 unused, and spot 7, n 138240-138690 at kit 0) [verified xemu, the owner's real input: the owner's X.28 demos' per-tick trace (2026-10-15)]. The aims are saved; a re-aimed light's old orb goes dark (the panels' stored turnOff), so a miss is re-aimed: no lockout"

[[event]]                     # the blue machine: the beam to frag_earth_3, both machines on (Step R1.8i, AZ-355)
id = "e6.blue_machine.on"
zone = "e6.Z001"
requires = "event:e6.Light6Shape.joystick & ((event:e6.red_machine.on & event:e6.Light5Shape.joystick) | skip:e6.slide_flight)"
why = "BlueOnToggle (on while RedMachineCombiner2 is: BT1-BT3, all three blue orbs lit) turns on the blue beam (Public_FieldShape1, a push 385 m long, and PublicGuideShape solid) [verified data]. Blue 8 is lit only by Light2 and blue 9 only by Light3 (on the upper ring), so blue 7 needs Light6, and with both machines on red 4 needs Light5 and red 5 and red 6 Light1 and Light4: all six lights, one on each orb [verified data, the red machine's why]. The owner (2026-10-14): red first, then upper-ring lights onto red orbs and red ones onto blue until both are lit. So: the red machine from the lower ring, its lift up, Light5 onto red 4 and Light1 onto red 6 (each red orb held by two lights), Light3 onto blue 9; back down, Light2 onto blue 8 and Light6 onto blue 7: blue on and red still on, whose lift takes the player back up to the steam vent (frag_earth_3's way in). Sitting r18i: exactly that, real aims from each pad, both machines on in five sequences (rows full-1, full-2, module-2, module-3, and step by step red-first, upper-swap, L3-B9, lower-blue) [verified xemu, placed: R6 onto each pad]. Without the red machine (e6.slide_flight, held: flapping up the slide to the upper ring) Light2, Light3 and Light6 light blue alone. DissableToggle, on while exactly one machine runs, pulses every pad's xorCombiner when a machine turns on or off: the pad the player stands on lets go of its joystick and every other pad's Mirror_Toggle runs its 4 s lock, so every spotlight's joystick rises 1.5 m (Mirror_Joystck_Timer -> Joystick.translateZ) [verified data]; r18h's lights 2 and 3 that 'never engaged' once the red machine was on (AZ-355) were its solver pressing X from the pad at the joystick's old height: walked up to, the risen joysticks engage (row l3-probe, then every aim of full-1, full-2, module-2 and module-3). Nor does either machine shut the other out: blue first (Light2, Light3, Light6), then red (Light5 onto red 4, Light1 onto red 5, Light4 onto red 6), both on (row blue-then-red-2); r18h's red-after-blue miss was its solver's too. The blue machine's camera (RedMachineCamera_Timer1, about 29 s) and the red one's (RedMachineCamera_Timer, about 20 s) hold the stick while they play"

