note = "frag_earth_3 hangs at the blue beam's far end, 9.1 m over e6.Z029 (the E6_E2b switch's ledge). The way in (Step R1.8i): the upper ring's steam vent, pCubeShape63 (springboard 17.5, autoSpring: a launch straight up that keeps the horizontal speed), stands 10 m beside the beam; the launch carries the player into the beam's push field (Public_FieldShape1, on with BlueOnToggle), which holds a body in the air and carries it along the beam to its far end; there a jump and two flaps take the fragment [verified data: the vent's springboard, the field's push]. So the blue machine (e6.blue_machine.on, whose red-machine way leaves the lift on to come back up to the vent, the slide skip's the slide) and no power: the owner (D218, X.28 spot 7: \"got the disc fragment\") from e6's start (the E2_E6 arrival, e6.Z053), kit 0 and both machines on [placed: lit by real aims from placed starts in spots 4 and 6, BlueOnToggle re-latched after the re-entry], dropped into the garden, rode a red lift up to the ring, took the vent's launch into the beam and the fragment (fge3 0 -> 1 at n 139940), 0 flaps [verified xemu, the owner's real input: the owner's X.28 demos' per-tick trace (2026-10-15), n 136042-139940]; spot 6 the same from the ring with air 1 worn and 0 flaps (n 128721-129272). The fragment is taken from the beam, not from e6.Z029's ledge under it, so it is joined to the ring's zone (e6.Z001, [members]; default taken under D115). Sitting r18i (2026-10-14; runs way-in-1, way-in-2, module-way-in-4): after the full sequence (both machines on), the red lift up from its floor, the route pilot (hard, air 2) to the vent's side, onto the vent (a 17.3 m launch), into the field, 13 s along the beam and a jump with two flaps: taken 3 of 3 (the third by scripts/xemu_minigames.py's spotlights, lift and vent_beam) with kit E2 A2 F2 W2 held and no damage [verified xemu, placed: R6 onto each pad between aims and onto the lift's floor, whose way in from the garden the pilot didn't find (rows garden-into-lift, garden-lift2b); the vent, the beam and the fragment real input]. r18h's beam-1 took it once from a placement on the beam itself. The conservative kit E2 A2 F2 W2 it carried until Step R1.8q came down to the demo's kit 0"

