[[event]]                     # the tree song (Step R1.8f)
id = "e6.tree_song.played"
zone = "e6.Z001"
requires = "flag:e2.crystal_lightning.hit & flag:e7.crystal_fire.hit & flag:e5.crystal_whirlwind.hit & flag:e5.crystal_pulse.hit & earth>=1 & air>=1 & fire>=1 & water>=1"
why = "the four crystals' globals and a staff hit of each kind at its pedestal, seven in order: smash, lightning, fire, whirlwind, lightning, smash, fire [verified data: $RP r0/tools/logic_dump.py e6 '^(Detect_.*Shape[0-9]|Song.*|ExitToggle)$' --hops 2: WhichWackType_max numbers a tone 1 fire, 2 smash, 3 lightning, 4 whirlwind (FireSound_and and the others: the pedestal's magic AND its crystal's latch; 5 is a plain whack on Detect_fireShape1), AdvanceTone_timer steps Tone01..07_hit_latch one hit at a time, and Tone_solution_and wants the solution toggles' windows 2, 3, 1, 4, 3, 2, 1, the order public_EarthSong_timer plays]. The staffs: smash earth + air + fire, lightning air + fire + water, fire earth + fire, whirlwind earth + air [verified data: config.xbr magic]; level 1 suffices (an AND on any non-zero magic) [verified xemu, placed: rz-b2 I-3 for whirlwind]. The crystals' own kits already hold those four elements; the song names them so the gate reads as the game does. A wrong tone fills its latch; after the seventh the timer resets every latch (AdvanceTone_disable_or), so the song is played again: no lockout. SongPuzzleSolved_toggle and CrystalDoorTimer are saved"

[rig_held]                    # the tree's moving parts: no ride the probe edges model (Step R1.8j)
polySurfaceShape571 = "the crystal door's right leaf: CrystalDoorTimer swings it open once the song is played (SongPuzzleSolved_toggle), so it carries no one and the way through it is the door edge below [verified data + xemu: sitting r18j, rows tree-exit-1, tree-door-shut-1]"
polySurfaceShape572 = "the crystal door's left leaf, as polySurfaceShape571"
"Bridge:BridgeShape" = "the bridge from the trunk's inner ramp into the elevator car: ExitToggle slides it 4 m when the car leaves its foot (Bridge_Transform), so it is walked, not ridden, and only inside the tree [verified data + xemu: r18j tree-exit-1]"

