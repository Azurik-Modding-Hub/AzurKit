[exit."e6/g0/r3467"]          # E6_A1_levelSwitch: the tree's elevator (Step R1.8j)
from = "e6.Z025"
requires = "true"
why = "the owner (2026-10-14): \"The tree's elevator\". Up the trunk's inner ramp (e6.Z025) to the bridge, which leads into the elevator car standing at the shaft's foot; ExitTriggerShape fills the car, so stepping in turns ExitToggle on (TurnOn_andCombiner, unless the player arrived from a1), which raises the car (ElevTransform) and at 0.8 of its climb fires E6_A1_levelSwitch [verified data: $RP r0/tools/logic_dump.py e6 '^(ExitToggle|ExitTriggerShape|TurnOn_andCombiner|E6_A1_levelSwitch)$']. In xemu after the song (sitting r18j, tree-exit-1): the route pilot walked from the crystal through the door and up the ramp to the bridge, a walk along it into the car touched the trigger in 95 ticks and the car carried the player to a1 [verified xemu, placed: loadvm vanilla-rz-e6-song with the four crystal latches set, kit E1 A1 F1 W1; the song by Minigames.song]. Nothing past the door gates it"

