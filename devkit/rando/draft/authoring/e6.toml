# e6's hand decisions for `azurik-mod rando author` (Step R1.11c): what the derive (derived/e6.json.gz) can't decode
# or doesn't model. Zones are the derive's (e6.Z<n>); a default taken under D115 says so. e6 is the great tree's
# garden. Two progression minigames (Step R1.8f's minigames report, 2026-10-13):
# - the tree song: its four pedestals (Detect_fire/smsh/litn/wind) play a tone on a hit of their own staff, and a tone
#   counts only once its crystal's global is set (SongFire1_hit in e7, SongLightning3_hit in e2, SongSmash2_hit and
#   SongWhirlwind4_hit in e5) [verified data + xemu: rz-b2 I-3]; seven tones in order latch SongPuzzleSolved_toggle,
#   which opens the tree's crystal door (CrystalDoorTimer); inside, the trunk's ramp leads to a bridge into the
#   elevator car, where ExitTriggerShape's touch turns ExitToggle on, which raises the car (ElevTransform) and at 0.8
#   of its climb fires E6_A1_levelSwitch [verified data: $RP r0/tools/logic_dump.py e6
#   '^(ExitToggle|TurnOn_andCombiner|SongPuzzleSolved_toggle)$'; verified xemu: sitting r18j, Step R1.8j];
# - the spotlights (Step R1.8i, AZ-355): six spotlights in a ring round the tree, Light2, 4 and 6 on the lower ring and
#   Light1, 3 and 5 on the upper one (the second level), each aimed at one of two of the tree's six orbs; three red
#   light the red machine (e6.red_machine.on: its gravity lifts up to the upper ring), three blue the blue beam
#   (e6.blue_machine.on), which the upper ring's steam vent launches the player into, up to frag_earth_3 (e6/g0/r2755).
#   Red first from the lower ring, then lights swapped until both are on (the events below).
# The conservative-kit rule is a1's (draft/authoring/a1.toml's header).
level = "e6"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

