to = "e6.Z001"
requires = "true"
why = "the lake (e6.Z003: Light4's island side, the underwater obsidian r2747 and r2744) is left at kit 0 up a tree stump's vines (the owner, verbatim: \"you can get out of the lake in e6 with kit 0 by climbing vines on a tree stump within the lake\", which lead \"back to the song tree puzzle area near the locked gate\"; D745, 2026-10-26). In the level data: climbable static faces at the lake's surface (28 columns beside e6.Z003's water) rise 12-13 m to e6.Z027's terrace, 1.6 m off them, whose 2.6 m walk-off (rank 0, modelled) drops into the garden e6.Z001, where the song's four pedestals and the crystal door (CrystalDoorTimer, shut until the song) stand [verified data: Step R1.24d's read of e6's lake climb (2026-10-26), rel]. The derive has no climb out of water (AZ-745), and its barrier cut holds both legs as bypasses (FireWall_02 and AcidBlock_02), so this hand edge is the owner's way, unmeasured in L3"

