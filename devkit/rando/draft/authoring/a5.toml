# a5's hand decisions for `azurik-mod rando author` (Step R1.11a): what the derive (derived/a5.json.gz) can't decode
# or doesn't model. Zones are the derive's (a5.Z<n>); a default taken under D115 says so. a5 is the Atmospheric
# Processor: a central tower and three rotating sub-mains (Sub_Main, Sub_Main1, Sub_Main2) carrying moving smokestacks;
# the derive follows neither the sub-mains' rotation nor the smokestacks. The conservative-kit rule is a1's
# (draft/authoring/a1.toml's header).
# The cannon minigame (Step R1.8f) [verified data: $RP r0/tools/logic_dump.py a5 '^(Active_switchShape|HelpToggle|Nand|
# Barrel_Fire_timer|Sub_Main.*:Public_Ice_toggle)$'; sitting commentary v2@95:00]: the cannon's joystick (Active_switchShape)
# turns and tilts the barrel (Rotate_timer, Tilt_timer: the stick sets their rates) and, while held, fires every 2.2 s
# (Barrel_Fire_timer); a shot sinking into a smokestack's Public_Ice_sinkShape breaks that stack's ice cube (Public_Ice_toggle,
# saved), so the spires' lower platforms can be stood on; the joystick stays live until all nine are broken (Nand ->
# HelpToggle). Its way, by the platforms, the islands and their tube, leads to the three steam-3 ice blocks (IceMelt_toggle1,
# IceMelt_toggle2, IceBlock_03: andCombiner1 -> FinalFan_toggle, the final fan and jump pad, blocker family a5.final_fan_pad)
# and power_air. No item works the cannon; a miss is fired again (no lockout). The derive follows neither the rotating
# sub-mains nor the tube, so power_air keeps the conservative kit below (its steam-3 blocks inside it).
level = "a5"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

