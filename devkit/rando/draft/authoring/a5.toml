[gates]
"a5.Damage_FieldShape" = "water>=2"   # the hub's ring of fire walls (Damage_FieldShape, _ and __: BlockerShape solids with a damage field; the generated water>=2)

[gate_sides."a5.Damage_FieldShape"]   # the hub inside the ring and the zones its unmarked derived edges reach (AZ-714, Step R2.18)
near = ["a5.Z052"]
far = ["a5.Z012", "a5.Z001", "a5.Z041", "a5.Z100", "a5.Z102", "a5.Z103", "a5.Z147", "a5.Z152", "a5.Z178"]
why = "the owner (D656, verbatim: \"its not possible to get out of this ring of fire walls without water 2\"): a5's start, the hub a5.Z052 (Teleporters_AlwaysON:TeleLocator2), sits inside the ring. Its gate edges (to a5.Z098, a5.Z101, a5.Z107) pass the walls and ask water 2 already; these far zones the derive reaches from it unmarked: a5.Z012 by a 4.6 m sweep jump that the derive's own bypass records list, from a5.Z012 back, as a crossing of all three walls (Damage_FieldShape, _ and __), and a5.Z001, Z041, Z100, Z102, Z103, Z147, Z152 and Z178 by the chain-bob rigs (Chain_Bob, Chain_Bob1, Chain_Bob2), whose way leads on to a5.Z129 [verified data: derived/a5.json.gz]. So an edge between the hub and them asks the walls' water 2. Not checked: the hub's teleporter (a5.Z052 <-> a5.Z036) and the flights from a5.Z036 (a5_dock at air 2, a5_z043 at air 3); the owner never left a5.Z052 (S16) [default taken under D115: kept]"

[[edge]]                      # out to the three islands (Step R1.8j)
from = "a5.Z006"
to = "a5.Z033"
requires = "air>=2 & water>=3 & fire>=3 & earth>=2"
why = "the owner (2026-10-14): \"over the islands and through a tube\": the cannon's broken ice (the header), the spires' lower platforms out to the islands, and at an island's foot a tube (Chain_Bob: Public_Plat_Switch and Public_Field touched -> Public_Chain_toggle -> ROTY_timer) over to its top, where its steam block stands (v2@95:00: 'go out to those islands ... wait at the bottom of those islands for a tube that takes you over to that island over there and you've to melt the steam block it's at the top'). The derive follows neither the rotating sub-mains nor the tubes: the conservative-kit rule's kit (the route's a5/g0/r733; default taken under D115). This is the +y island (a5.Z033, Iceblock_0Shape3 g0/r858)"

[[edge]]
from = "a5.Z006"
to = "a5.Z028"
requires = "air>=2 & water>=3 & fire>=3 & earth>=2"
why = "the -150 degree island (a5.Z028, Iceblock_0Shape3 g0/r757), as the +y island's edge"

[[edge]]
from = "a5.Z006"
to = "a5.Z034"
requires = "air>=2 & water>=3 & fire>=3"
why = "the -30 degree island (a5.Z034, IceBlock_03), by its own way (Step R1.31b): of the three sub-mains' tori (the rigs Sub_Main:, Sub_Main1: and Sub_Main2:pTorusShape5) only this island's, Sub_Main2's, also joins a5.Z008, a plain jump below the dock (the derive's rigs), and X.35 C1d's owner went from the dock with air 2, water 3 and fire 3 and no earth (x35-C1d-a5-start-a2w3f3, real input) by a5_z020, a5.Z008 and the island's foot a5_z004 onto it and melted its block [verified xemu: x35 C1]: the run's kit. The other two islands keep the conservative kit, which no run has lowered"

[[edge]]
