[[event]]                     # the three islands' steam blocks (Step R1.8j)
id = "a5.ice_block1.melted"
zone = "a5.Z033"
requires = "fire>=3 & water>=3"
why = "the +y island's steam block (Iceblock_0Shape3 g0/r858): a steam-3 hit (its magic >= 3) turns IceMelt_toggle1 on, which melts the block, swings that island's big arm out (Public_Big_Arm_timer4: TranY and its jumper fan Fan1_tran), makes its purple path solid (PurpleShape) and feeds andCombiner1 [verified data: $RP r0/tools/logic_dump.py a5 '^(IceMelt_toggle[12]|IceBlock_03:IceMelt_toggle|andCombiner1|FinalFan_toggle|Public_Big_Arm_timer[234])$']. The derive's barrier a5.Iceblock_0Shape3 holds two islands' blocks (g0/r757 and g0/r858, one name), so each island is its own event here"

[[event]]
id = "a5.ice_block2.melted"
zone = "a5.Z028"
requires = "fire>=3 & water>=3"
why = "the -150 degree island's steam block (Iceblock_0Shape3 g0/r757): IceMelt_toggle2, its arm Public_Big_Arm_timer2, as a5.ice_block1.melted"

[[event]]
id = "a5.ice_block3.melted"
zone = "a5.Z034"
requires = "fire>=3 & water>=3"
why = "the -30 degree island's steam block (IceBlock_03:Iceblock_0Shape3): IceBlock_03:IceMelt_toggle, its arm Public_Big_Arm_timer3, as a5.ice_block1.melted"

[[event]]                     # the big fan under power_air (Step R1.8j)
id = "a5.final_fan.on"
zone = "a5.Z006"
requires = "event:a5.ice_block1.melted & event:a5.ice_block2.melted & event:a5.ice_block3.melted"
why = "the owner (2026-10-14): \"we must complete all three islands, and then the big fan under the air power turns on and lifts us up so we can collect it\". andCombiner1 ANDs the three IceMelt toggles -> FinalFan_toggle (lock), which makes the big fan's jump pad solid (Big_Float_Fan1:Public_Jump_padShape) and its updraft on (Public_Air_fieldShape pushEnable, 74-103 m) and turns the axis field's push from -3 to +3 (toggle9, off again once power_air is taken) [verified data]. Bound at the dock with the islands' kit (the conservative-kit rule)"

[[location]]
id = "a5/g0/r733"
requires = "event:a5.final_fan.on | (skip:a5.one_island_air2 & (event:a5.ice_block1.melted | event:a5.ice_block2.melted | event:a5.ice_block3.melted))"
note = "power_air on a5.Z070 (the hub over the big fan), which the derive reaches only physically (+probe:float): the big fan, on once the three islands' steam blocks are melted (a5.final_fan.on), lifts the player to it (the owner, 2026-10-14); or the owner's one-island skip with air 2 (tricks.toml a5.one_island_air2: confirmed, X.35 C1, where the owner took it after the -30 degree island alone; held, as no kit in logic melts one island's block without the other two: a5 is entered only from a3's hub, which asks earth 2, the one kit term the islands' ways in differ by). Its kit is the islands' (the conservative-kit rule: the route's a5/g0/r733). Sitting r18j (Step R1.8j): each island's block melted by a real steam cast from a placed start on its top (3 of 3; a5-island1-melt-4, a5-three-islands-1), and then FinalFan_toggle, the pad's solid and the updraft were on; the updraft lifted a jump from the hub 29.8 m (a5-fan-lift-3), but the pickup was not taken in seven placed tries (the axis's own down-push field, 7.9 m round it, holds a player there) and the islands' way out (the cannon's platforms, the tubes) was not run: no proof mark (default taken under D115). Sitting x35 (X.35 C1, 2026-10-16) took it by the one-island skip, not the fan"

