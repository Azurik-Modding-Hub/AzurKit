# d1's hand decisions for `azurik-mod rando author` (Step R1.11d): what the derive (derived/d1.json.gz) can't decode or
# doesn't model. Zones are the derive's (d1.Z<n>); a default taken under D115 says so. d1 is the Death realm's spires:
# the arrival from town (startspotShape) rides the grate elevator 37 m down into the death seal's chamber (d1.Z031)
# [verified xemu, placed: sitting r111d], the seal (all five discs at 4) opens the chromatic gate onto the outer spires
# (the floor-7 complex: floors 6-8, the beam walkways, the acid blocks, the entrance bridge); the bridge-end cutscene (D2_movie_levelSwitch) drops the player into d2, whose door comes back to
# floor 1 (D2_D1), and the central spire's elevator (ElevatorShape, floors 1-11, called by CallField1-11 and steered
# by the floor switches, three of them keyed by the diamond-battery keylocks: death_keylock1 -> switch7,
# death_keylock -> switch4, death_keylock2 -> switch9) serves the inner floors; Spideyzar spawns when the elevator's
# call selects floor 9 (switch9) [verified data: generated/d1.json, logic_dump d1; RANDOMIZER_PLAN 2.7].
#
# The elevator is a rig the derive doesn't follow (public_Elevator's gate undecoded). Its floors take the
# conservative-kit rule (draft/authoring/a1.toml's header, default taken under D115): reached from floor 1 (after d2:
# the d1.spires time-saver's plain route, "d2's way back reaches d1's floor 1, whose battery-free elevator serves
# floor 5"), with the elements the vanilla run holds in d1 (air, water, fire, earth 3: the route's button:d1.seal to flag:d1.spideyzar.killed), the death
# seal and the d1 keylocks the route uses before each floor's first step; floor 9 needs death_keylock2 (switch9's key).
level = "d1"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

[names]
d1_z219 = "d1.Z218"        # Step R1.24a: Z218 since the re-derive (was d1.Z219); the id kept
d1_core = "d1.Z031"           # the town arrival: the grate elevator's foot in the death seal's chamber [verified xemu, placed: sitting r111d]
d1_floor1 = "d1.Z015"         # floor 1 (Floor01_locShape, the save point D1_1), behind the d2 door
d1_floor9 = "d1.Z005"         # floor 9: Spideyzar's room (spideyzarRoomLocationShape)
d1_floor11 = "d1.Z016"        # floor 11: death_keylock2 (switch9's key) and the save point D1_2

[[event]]
id = "d1.spideyzar.killed"
of = "d1/g0/r799"
zone = "d1.Z005"
requires = "air>=3 & water>=3 & fire>=3 & earth>=3"
terminal = true
why = "Spideyzar, in his room on floor 9 (the migrated requirement kept, default taken under D115); the kill ends the game (D76, victory; RANDOMIZER_PLAN 2.7 [verified data])"

[[edge]]                      # floor 1's door to the d1/d2 door pair, from either side
from = "d1.Z125"
to = "d1.Z015"
requires = "true"
why = "D2Door_toggle opens on a touch of its field (DeathLevelTransition:LevelDoor2:public_DoorFieldShape) [verified data], which the derive sets from both sides (d1.Z015 and d1.Z125) but credits at the lower, floor 1's, so the D2_D1 arrival's side could not open it: a touch from either side (default taken under D115)"

[[edge]]
from = "d1.Z015"
to = "d1.Z125"
requires = "true"
why = "the same door from floor 1's side"

[exit."d1/g0/r2265"]          # D1_Town_levelSwitch: the entrance's exit field
from = "d1.Z031"
to = "town.Z021"
requires = "true"
why = "touch(D1_Town_ExitFieldShape) [verified data]; the derive places neither its field nor the arrival on a floor: the arrival rides the grate elevator down into the seal's chamber (d1.Z031) [verified xemu, placed: sitting r111d], and the exit field is taken as the same elevator's way back up (default taken under D115); its arrival, D1_TownShape, stands on town's own grate elevator by the temple's death door, which the derive leaves without a floor: the temple's zone town.Z021, where toD1_levelSwitch leaves from (default taken under D115)"

[exit."d1/g0/r2271"]          # D2_movie_levelSwitch: the bridge-end cutscene into d2
from = "d1.Z056"
to = "d2.Z015"
requires = "event:d1.walkwayGenerator2_PressurePlateShape.touch | event:d1.walkwayGenerator2_BaseShape.touch"
why = "the walk from walkway generator 2 (d1.Z056) onto the beam walkway past the bridge-end field fires it at kit 0, 5 of 5 in xemu and in the owner's demo (X.78, D722 row 10), so it leaves from there once walkway generator 2 (its plate beside d1.Z056) has raised the walkway (Step R1.24b; the derive's field zone is the walkway, d1.Z025). and(DeathMovie_disable_toggle, touch(DeathMovieFieldShape)) [verified data]: one shot (the touch turns the toggle off), harmless since the lab's only way out is the lens-locked door, after which the d1/d2 door pair stays open (default taken under D115); it lands the player from D1_D2_Fall alive on the lab floor d2.Z015 [verified xemu, placed: sitting r111d]"

[exit."d1/g0/r2266"]          # D1_D2_levelSwitch: the floor-1 door to d2's door
