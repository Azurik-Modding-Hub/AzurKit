# a3's hand decisions for `azurik-mod rando author` (Step R1.11a): what the derive (derived/a3.json.gz) can't decode
# or doesn't model. Zones are the derive's (a3.Z<n>); a default taken under D115 says so. a3 is the Rain Machine: its
# slides are repaired by the valves, floor switches and cloud suckers (Valve_03_*, Floor0*_switch_toggle,
# CloudSucker0*_toggle [verified data: logic_dump a3]); the derive decodes the cloud suckers but not the valves.
# The conservative-kit rule is a1's (draft/authoring/a1.toml's header).
level = "a3"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

[names]
a3_hub = "a3.Z003"            # Hub01: the startspot arrival of EndFight (airship) and W1_A3 (w1), the save point A3_1

[exit."a3/g0/r2981"]          # A3_A5_levelSwitch: the docked ship's platform switch (actionButton airshipShip1:Switch_PlatformShape)
from = "a3.Z003"
requires = "true"
why = "the switch is on the docked ship by the hub the player arrives at; the derive joins its 3 m2 platform (a3.Z015) to the hub one way only (the ship's control lift and dome doors are rigs it doesn't follow) [inferred] (probe sitting; default taken under D115)"


[members]                     # the conservative-kit rule (draft/authoring/a1.toml's header): joined to the arrival's node
"a3/g0/r1500" = "a3.Z003"                 # power_water_a3: on a slippery slope (no zone since Step X.16, AZ-359), which the derive reaches only physically (R_phys only)
"a3/g0/r1498" = "a3.Z003"                 # frag_life_2: unplaced
"a3/g0/r2563" = "a3.Z003"                 # diamond: on a3.Z155, the roofed hop's takeoff, which since Step X.16 the derive reaches from no zone the arrival reaches (AZ-359: the icy slopes round it are slides)
"a3/g0/r2572" = "a3.Z003"                 # sapphire: on a3.Z162, what is left of the docked ship's 608 m2 icy platform, which since Step X.16 the derive reaches from no zone the arrival reaches (AZ-359: the icy slopes round it are slides)
"a3/g0/r2595" = "a3.Z003"                 # obsidian: on a3.Z165, the roofed hop's landing, which since Step X.16 the derive reaches from no zone the arrival reaches (AZ-359: the icy slopes round it are slides)
"a3/g0/r2587" = "a3.Z003"                 # obsidian: walled on (static level mesh) (a static)
"a3/g0/r2575" = "a3.Z003"                 # sapphire: on a3.Z001, which the derive reaches in no rung
"a3/g0/r2578" = "a3.Z003"                 # diamond: on a3.Z004, which the derive reaches in no rung
"a3/g0/r2566" = "a3.Z003"           # emerald: on a3.Z095, whose node the derive reaches but gives no way back to an exit (an undecoded teleport, ride or slide)
"a3/g0/r2584" = "a3.Z003"           # ruby: on a3.Z002, whose node the derive reaches but gives no way back to an exit (an undecoded teleport, ride or slide)
"a3/g0/r2591" = "a3.Z003"           # obsidian: on a3.Z079, whose node the derive reaches but gives no way back to an exit (an undecoded teleport, ride or slide)
"a3/g0/r2593" = "a3.Z003"           # obsidian: on a3.Z083, whose node the derive reaches but gives no way back to an exit (an undecoded teleport, ride or slide)

