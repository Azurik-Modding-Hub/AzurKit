# e7's hand decisions for `azurik-mod rando author` (Step R1.11c): what the derive (derived/e7.json.gz) can't decode
# or doesn't model. Zones are the derive's (e7.Z<n>); a default taken under D115 says so. e7 is the key farm: entered
# only by e2's MineCar2 gondola (SwitchE5a1, lock minecart_e2e7) and left only by it (E7_E2_switch) [verified data].
# Its arrival elevator (Elevator_toggle, turned on by LevelLoad_xorCombiner) lowers the bucket from the gondola's
# station about 146 m onto the hall e7.Z000; the bucket's GoTriggerFieldShape toggles it back up to
# ExitFieldTriggerShape, E7_E2_switch's only input [verified data: $RP r0/tools/logic_dump.py e7]; that the ride lands
# on e7.Z000 is [inferred] from the bucket's column (the probe sitting, sitting r111c, 2026-10-13, owes it).
level = "e7"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

[names]
e7_core = "e7.Z000"           # the hall: the elevator's foot, the six keylords, the save point E7_1
e7_dark_room = "e7.Z002"      # the dark room (DarkRoomCellShape, its spot DarkRoomShape), obsidians e7/g0/r1045 and r1047: the nolight skip's dark_node (Step X.16: the room's floor zone; the slippery bowl named before is no zone, AZ-359)

[dark]
e7_dark_room = "e7.dark_room_nolight"   # light gates no game logic in e7 [verified data, rz-b2 I-14]; darkness is a logic need (dark_fire) or its nolight skip

