[[edge]]                      # out of the sewer (Step R1.24d, D745; was Step R1.24b's water-1 stand-in, D722 row 12)
from = "town.Z003"
to = "town.Z004"
requires = "air>=1"
why = "the sewer (SewerCellShape: obsidians r1738-r1746 and 19 diamonds, town.Z003) is left back to the plaza (town_central) with air 1, and water 1 alone does not get out (the owner, verbatim: \"you can get out of the sewer with air1\", and asked about water 1: \"No, air 1 only\"; D745, 2026-10-26); never at kit 0 (\"row 12 is not possible with kit 0\", the owner's demo, X.78, D722 row 12). Since the water fix (AZ-356) no derived edge leaves its 21 zones at any kit or tier (its only way out was the hull's swim down into the sea 50 m under its water), so this hand edge is the owner's fact, unmeasured in L3 (AZ-738's searches ran out of steps)"
