# or doesn't model. Zones are the derive's (e2.Z<n>); a default taken under D115 says so. e2 is the earth realm's
# valley: the town arrival's canyon (e2.Z015, the pocket) opens on the arena's double door (RuinDoorTimer, any of its
# four pads [verified data]); the main valley (e2.Z000) holds the two gondola docks (MineCar to e5, MineCar2 to e7,
# both moved only once the two key_circuitboard locks are in: Topcartoggle1/2 <- MineCarRide2:andCombiner1 [verified
# data; verified xemu, placed: rz-b2 I-10]) and the gear locks: E2_E5 and E2_E6 fire only with all three key_gear
# locks in (toggle17, toggle18, toggle19 in their AND) [verified data: generated/e2.json gate hints]. The
# conservative-kit rule is a1's (draft/authoring/a1.toml's header).
