# e5's hand decisions for `azurik-mod rando author` (Step R1.11c's draft, finished at Step R1.8d): what the derive (derived/e5.json.gz) can't decode
# or doesn't model. Zones are the derive's (e5.Z<n>); a default taken under D115 says so. e5 is the earth guardian's
# level: the seal (touch with 3 earth fragments) moves EarthBossDoor; in the arena each of AcidBlock_04..07 turns its
# tornado vent on at magic >= 2, the four vents' count drives the guardian's death, and numDead stops the kill wind
# (BossDead_KillWind_toggle), raises the boss floor (BossFloor_Elevator_damper) and enables the 4th fragment's
# generator [verified data: $RP thresholds/REPORT.md §6, e5_boss_dump.txt]. The conservative-kit rule is a1's
# (draft/authoring/a1.toml's header); Step R1.8d applies it to the second fuse key (the derive puts it behind the
# conveyors its own lock starts), the pit under it and the spots the derive joins to the arrival only one way.
level = "e5"
probe = ["swim-exit", "climb", "push", "current", "teleport", "door", "rig", "lip", "sweep"]   # ordinary movement the derive cannot measure, admitted as assumed (R1.8's list, default taken under D115); sweep at its own tier since Step R1.2b (D156: the +1 shift, an inference, put the vanilla route's curved crossings above safe)

