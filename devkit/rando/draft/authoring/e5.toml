e5_z918 = "e5.Z920"        # Step R1.24a: Z920 since the re-derive (was e5.Z918); the id kept
e5_dock = "e5.Z007"           # the E2a_E5a gondola arrival, the battery locks earth_keylock6/7, the save point e5_1
e5_arena = "e5.Z001"          # the guardian's arena: the four tornado vents (AcidBlock_04..07)
e5_boss_floor = "e5.Z037"     # the boss's floor (bossGeneratorShape, TowerElevatorFull1:FloorShape2) under the 4th fragment

