# The solver's toy database (tests/rando/reachdb; docs/RANDOMIZER_DB.md §15). r1 is authored: one room off the
# start for each mechanism the reach models. The pool locations (generated/r1.json, by cell):
#   Start r1-r7: power_life, power_water, power_fire, key_red, obsidian x2, frag_air_1;
#   Start r8 (inside r1.wall), r9 (inside r1.ice), r10 (r1.olock's contents), r11 (a geode gem), r12 (needs the
#   toggle r1.lever), r13 (needs flag:r1.ice.destroyed); Vault r14; Ice r15; Hall r16 (key_red); Inner r17, r18;
#   Arena r19 (after the boss); Pit r20; Ledge r21; Cave r22; Crypt r23; Tower r24; Secret r25; Mine r26; Shaft r27;
#   Nook r28 (behind r1.crack, which respawns and is destroyed from the nook only); Start r29 (inside r1.crack),
#   r43 (key_red), r49 (needs r1.relay, a button bound to an uncoded keylock); Start r47 (inside r1.gate, whose
#   override and hand requirements both count), r48 (needs r1.relay_driven, a relay with an override), r50 (needs the
#   emerald cluster of the stub r2, yield 5), r51 (needs the flag of r2's respawning barrier, never set), r54 (inside
#   r1.slab, destroyed from the dark crypt), r56 (gated by a keylord no event binds); Dock r52 (reached from r2 only).
#   Start r60-r62 (key_blue), r63 (needs r1.lock_d, the blue lock on the start, whose key count reads R_phys: the blue
#   locks r1.lock_e in the chute, a drop that assumes r1.lock_d is open, and r1.lock_f in the attic, behind an edge
#   out of logic that the toggle r1.lever opens); Gap r64 (behind an edge of the phys tier, difficulty 0).
# Every other one holds a sapphire.
format = "azurik-rando-level/1"
level = "r1"
status = "authored"
route = ["r1/g0/r1"]

