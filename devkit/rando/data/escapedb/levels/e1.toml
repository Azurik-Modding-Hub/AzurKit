# The escape's toy database (tests/rando/escapedb; docs/RANDOMIZER_DB.md §15). e1 is authored: the start, the hub
# and one room off the ledge for each counter-example of RANDOMIZER_PLAN §2.13. The pool locations (generated/e1.json,
# by cell): Beach r1 power_life; Cove r2 power_water, r3; Town r4 power_air; Throne r5; Pit r6; Cellar r7; Sink r8;
# Vat r9; Sump r10; Well r11; Loft r12; Bay r13; Tank r14. Every other one holds a sapphire.
#   CE1: the start reaches the hub only with water, and the water is in the cove, off the start.
#   CE2: the pit is a drop whose way back needs the lever, which is pressed on the beach, not in the pit.
#   CE5: the cellar's way back needs the winch, which is in the crawl, the pit's other room.
#   CE6: the throne is a one-way final arena: its event is terminal (victory needs reach only).
#   CE7: the sink is a drop that needs water to leave, open before the water is found.
#   The vat's only way in needs the valve its way out needs (forced on entry); the sump's needs it too, but a second
#   way in, from the town with air, doesn't; the well's drop assumes the lever; the loft's needs the hoist, which
#   nothing can press, or a skip; the bay's ways in and out need the crank, named second in an `|` whose first
#   operand, the shut, never opens; the tank's skip-free way in, from the ledge, needs the valve its way out needs,
#   and a skip drops into it from the sink, whose own escape then fails without the valve.
format = "azurik-rando-level/1"
level = "e1"
status = "authored"
route = ["e1/g0/r1"]

