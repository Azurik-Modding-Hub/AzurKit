confidence = "data"

[[edge]]
from = "i1_tower"
to = "i1_town"
kind = "walk"
confidence = "data"

[[location]]
id = "i1/g0/r1"
proven = { by = "data", ref = "toy" }

[[location]]
id = "i1/g0/r2"
proven = { by = "data", ref = "toy" }

[[location]]
id = "i1/g0/r3"
proven = { by = "data", ref = "toy" }
