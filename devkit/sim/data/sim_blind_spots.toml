# Code simulator Level 2 can't judge (Modkit's Step 2.10: what it hasn't proven).
#
# devkit/sim/l2.py reads this file.  A probe may stub only a function
# listed here, and Sim refuses to load a build whose bytes in [va, va + size)
# don't hash to `sha256` (the vanilla bytes) unless the running test is
# signed off, xemu_signoff("<session>") in tests/test_simulator.py, by a
# session in [signoffs] whose `spots` hold that spot's va.
# Function sizes come from a recursive descent over vanilla (direct branches
# and jump tables); site sizes are the patched instructions'.
#
# Protected (Q56): a spot or a sign-off goes in with owner review, never to
# get a test green.

# Step 2.11 xemu sessions: what each saw in game, and the listed spots it saw
# changed (`spots`), the only ones its sign-off unlocks.  Each session's
# report stays in the private evidence folder, under its name.
[signoffs.xemu-oracle-2026-10-09]
saw = """The roll slider (REPORT.md §5): its 0x8C745 shim, poked into vanilla's RAM \
on level 1 at 30 fps, makes BLACK's roll speed exactly k times vanilla from the roll's 5th tick on; \
the move code 0x47380 caps ground acceleration at about 3.27 m/s per tick, so on flat ground k = 2 \
rolls 6.226 m against 3.387 m (x1.838), k = 0 rolls in place and k = -1 rolls back; jab and sweep \
are unchanged.  Not seen: a built k != 1 XBE, 60 fps (fps_unlock), slopes, walls.  The logo skip \
(REPORT.md §7.2): qol_skip_logo's CALL at 0x5F6E5 reaches the shim and prophecy.bik starts 10 ms later."""
spots = []    # neither feature changes a listed spot

