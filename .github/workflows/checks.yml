# Checks beside the tests (Step 4.4ci), on every push to main and every pull request:
# - leak-guard: tests/_leak_guard.py over the checkout's files, then, as the pre-push hook does, over every file every
#   commit of the whole history adds or changes (a file a later commit deleted too; D961: no image or part of one, no
#   xemu disk, EEPROM dump, RAM snapshot or private key).
# - native: `python -m nativekit --check` rebuilds the committed native libraries from their sources and checks each
#   one's sha256 (D1019) on macOS, Windows and Linux. It is a no-op on a commit without src/azurkit/core/_native/
#   (lane 4.3t adds it).
# No secret, no pull_request_target; actions pinned by commit sha, their release beside it.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  # Every setup-uv step's manifest-file, inline so setup-uv fetches no manifest (tests.yml's env says why).
  SETUP_UV_MANIFEST: >-
    data:application/x-ndjson,{"version": "0.12.24", "artifacts": [
    {"platform": "aarch64-apple-darwin", "archive_format": "tar.gz", "sha256":
    "0c4346de7abdb49495b393b9ec809fe387aa43e586be20fecb972216c1e71732",
    "url": "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-aarch64-apple-darwin.tar.gz"},
    {"platform": "x86_64-apple-darwin", "archive_format": "tar.gz", "sha256":
    "4fa82e37cb94767661f532b001e470b67a186c7260e305bd84ddb78fd545c0b6",
    "url": "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-x86_64-apple-darwin.tar.gz"},
    {"platform": "x86_64-pc-windows-msvc", "archive_format": "zip", "sha256":
    "7c38608c8a18ee137d748a1773053b07ec8f3a30fab49aebaa6f4e4efeceb019",
    "url": "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-x86_64-pc-windows-msvc.zip"},
    {"platform": "x86_64-unknown-linux-gnu", "archive_format": "tar.gz", "sha256":
    "b4dfaef47d491a7296981f8374a4595f55dbf84e8937c8ecd2983574d8bb3da6",
    "url": "https://github.com/astral-sh/uv/releases/download/0.12.24/uv-x86_64-unknown-linux-gnu.tar.gz"}]}

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # every commit, for the history's scan
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          manifest-file: ${{ env.SETUP_UV_MANIFEST }}
      - run: |
          . scripts/ci_retry.sh
          retry "uv sync" uv sync --locked --no-build
      - name: The checkout's files
        run: uv run --locked python -I tests/_leak_guard.py
      - name: Every file every commit adds or changes (the pre-push hook's scan, no remote ref left out)
        run: |
          printf 'HEAD %s refs/heads/ci 0000000000000000000000000000000000000000\n' "$(git rev-parse HEAD)" |
            uv run --locked python -I tests/_leak_guard.py --pre-push no-remote

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out files as committed (the Windows runner's git would turn LF into CRLF)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Is src/azurkit/core/_native/ on this commit?
        id: native
        run: |
          if [ -d src/azurkit/core/_native ]; then echo "here=true" >> "$GITHUB_OUTPUT"
          else echo "src/azurkit/core/_native/ isn't on this commit: nothing to check"; fi
      - if: steps.native.outputs.here == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          manifest-file: ${{ env.SETUP_UV_MANIFEST }}
      - if: steps.native.outputs.here == 'true'
        run: |
          . scripts/ci_retry.sh
          retry "uv sync" uv sync --locked --no-build
      - name: nativekit --check
        if: steps.native.outputs.here == 'true'
        run: uv run --locked python -m nativekit --check
