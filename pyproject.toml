[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "azurkit"
version = "1.2.0"
description = "Patch packs, sliders, a randomizer and character swaps for Azurik: Rise of Perathia (Xbox), built from your own copy of the game."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["xbox", "azurik", "modding", "randomizer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "platformdirs>=4.5",
    "numpy>=2.5.4",   # the randomizer's maps and icons (tools/randomizer/art), the characters' models
]

# PyPI's page for a release never changes after its upload (tests/test_wheel.py holds the wheel's links to these).
[project.urls]
Homepage = "https://azurik-modding-hub.github.io/AzurKit/"
Source = "https://github.com/Azurik-Modding-Hub/AzurKit"
Issues = "https://github.com/Azurik-Modding-Hub/AzurKit/issues"
Changelog = "https://github.com/Azurik-Modding-Hub/AzurKit/blob/main/docs/DEVLOG.md"

[project.scripts]
azurkit = "azurkit.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",   # the suite in parallel: -n N --dist loadgroup (scripts/fullsuite.py; D991)
    "import-linter==2.15",
    "playwright==1.65.1",
    "ziglang==0.16.0",
]
# The app (D732): PyInstaller freezes it (scripts/freeze.py) and pywebview is its window; neither is in the wheel.
# proxy-tools is pywebview's, from the wheel vendor/ keeps ([tool.uv.sources] below).
app = [
    "pyinstaller==6.22.3",
    "pywebview==6.2.1",
    "proxy-tools==0.1.0",
]
# The icon (assets/icon/render.py, dev only): resvg draws the SVGs' turbulence filters, Pillow writes the favicon.
icon = [
    "resvg-py==0.5.0",
    "pillow==13.0.0",
]
# The developer side (D950, D990): `devkit/`, dev only, never in the wheel or the app (devkit/README.md). capstone
# disassembles (BSD), Unicorn runs the simulator's CPU (GPL-2: never shipped), mcp serves the azurik MCP server
# (devkit/mcp; MIT). One group, installed by default, so a broken install fails devkit's tests rather than skipping
# them. mcp brings cryptography, which pywebview imports when it is installed: scripts/freeze.py leaves it out.
devkit = [
    "capstone==5.0.9",
    "unicorn==2.1.4",
    "mcp==2.3.0",
]

[tool.uv]
required-version = ">=0.13"
default-groups = ["dev", "app", "devkit"]
# cryptography 49 and later ship no Intel Mac wheel, and every sync is --no-build (D1081: the Intel Mac app stays):
# devkit's mcp needs it (pyjwt[crypto]); 48.0.1 is the last release with a universal2 wheel. The app never holds it
# (scripts/freeze.py leaves it out). Lift this when a newer release has an Intel Mac wheel again.
constraint-dependencies = ["cryptography<49"]

# proxy-tools' one release, 0.1.0 (2014), is an sdist alone, so every sync built it, asking PyPI's index for
# setuptools: the one index ask a locked sync made (run 42335356378's Intel job failed on it). vendor/ keeps the wheel
# that sdist (the lock's sha256 ccb3751f529c) builds, byte for byte each time, with setuptools 84.2.1 and
# SOURCE_DATE_EPOCH=1399323744 (its upload time); its licence is MIT (NOTICE.md). tests/test_contracts.py holds it to
# the sdist's module and every other locked package to a wheel.
[tool.uv.sources]
proxy-tools = { path = "vendor/proxy_tools-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-rfEs", "--strict-markers", "-p", "no:cacheprovider"]
# Every run, here and in CI, keeps a test's tmp_path only when it failed, and of the failed sessions' folders (their
# failed tests' and their module- and session-wide ones: a browser's downloads, the site, the wheel) only the
# newest's (Step 4.5v2): pytest's own defaults kept each test's for 3 sessions, and one 8-worker gate's built images
# held 44 GB. A passing session's folder goes at its end.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "vanilla: reads the verified USA image; a run that selects one fails without it, so deselect with -m \"not vanilla\" (D26)",
    "europe: reads the verified Europe image, and is vanilla too; a run that selects one fails without it, so deselect with -m \"not europe\" (D26)",
    "pure: needs no game data; tests/conftest.py marks every test that isn't vanilla",
    "xdist_group(name): pytest-xdist's --dist loadgroup runs a group on one worker (tests/conftest.py: a module's frozen app)",
    "web: runs under Pyodide on Node (`uv run bootstrap.py` fetches Pyodide); a run that selects one fails without them, so deselect with -m \"not web\"",
    "xemu: devkit's xemu harness, on macOS's own calls (APFS clones, mach): CI's Linux and Windows legs deselect it with -m \"not xemu\"",
    "ghidra: needs Ghidra in .tools/, which devkit's Ghidra side installs; deselect with -m \"not ghidra\", as CI does",
]

# The engine's contracts (tests/test_contracts.py runs them, with the AST rules import-linter can't express).
[tool.importlinter]
root_package = "azurkit"

[[tool.importlinter.contracts]]
name = "the layers run core <- edits <- tools <- sdk <- {cli, app}"
type = "layers"
layers = [
    "azurkit.cli | azurkit.app",
    "azurkit.sdk",
    "azurkit.tools",
    "azurkit.edits",
    "azurkit.core",
]

[[tool.importlinter.contracts]]
name = "the five tools never import each other"
type = "independence"
modules = [
    "azurkit.tools.mods",
    "azurkit.tools.randomizer",
    "azurkit.tools.characters",
    "azurkit.tools.data",
    "azurkit.tools.saves",
]
