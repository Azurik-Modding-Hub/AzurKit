[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[project]
name = "azurkit"
version = "0.1.0.dev0"
description = "Patch packs, sliders, a randomizer and character swaps for Azurik: Rise of Perathia (Xbox), built from your own copy of the game."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["xbox", "azurik", "modding", "randomizer"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "platformdirs>=4.5",
]

[project.scripts]
azurkit = "azurkit.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "import-linter==2.15",
    "playwright==1.64.1",
    "ziglang==0.16.0",
]
# The app (D732): PyInstaller freezes it (scripts/freeze.py) and pywebview is its window; neither is in the wheel.
app = [
    "pyinstaller==6.22.3",
    "pywebview==6.2.1",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-rfEs", "--strict-markers", "-p", "no:cacheprovider"]
markers = [
    "vanilla: reads the verified USA image; a run that selects one fails without it, so deselect with -m \"not vanilla\" (D26)",
    "europe: reads the verified Europe image, and is vanilla too; a run that selects one fails without it, so deselect with -m \"not europe\" (D26)",
    "pure: needs no game data; tests/conftest.py marks every test that isn't vanilla",
    "web: runs under Pyodide on Node (`uv run bootstrap.py` fetches Pyodide); a run that selects one fails without them, so deselect with -m \"not web\"",
]

# The engine's contracts (tests/test_contracts.py runs them, with the AST rules import-linter can't express).
[tool.importlinter]
root_package = "azurkit"

[[tool.importlinter.contracts]]
name = "the layers run core <- edits <- tools <- sdk <- {cli, app}"
type = "layers"
layers = [
    "azurkit.cli | azurkit.app",
    "azurkit.sdk",
    "azurkit.tools",
    "azurkit.edits",
    "azurkit.core",
]

[[tool.importlinter.contracts]]
name = "the three tools never import each other"
type = "independence"
modules = [
    "azurkit.tools.mods",
    "azurkit.tools.randomizer",
    "azurkit.tools.characters",
]
