# The movement difficulty tiers (D108 Q256, D156, D167): margins over the physics envelope
# (azurik_mod/randomizer/physics.py; envelope.py beside this file reads them). A tier counts an edge-to-edge
# gap up to cos(stick_deg) x (the jump alone + reach x what perfect flaps add - the run a press takeoff_window
# ticks early loses) - landing_margin, at the landing dh + clearance, for the air rank (0 none, N air shield N)
# whose envelope covers it (physics.tier_gap). Each margin lies between Step R1.2's safe margins (s = 0) and the
# envelope (s = 1, frame_perfect): safe at s = 0.6 (D156: the least s at which every realm's route replays at
# safe), standard and hard a third and two thirds of the way on. tests/test_movement_envelope.py checks the tiers;
# the derive's stamp holds this file, so an edit makes every derived file stale (re-derive).
#
# A derived jump or flap edge carries a `difficulty`, the lowest tier whose margins it clears (1 safe ..
# 4 frame_perfect; D113). The randomizer's `movement_tier` option (D144, default "hard") makes an edge usable
# when its difficulty is at or below that tier's. R_phys (the trap check) always uses [phys] (difficulty 0:
# never a player tier).
#
# Fields: reach, the share of the distance perfect flaps add to the jump alone that the tier counts;
# takeoff_window, ticks of jump-press window before the edge (a running takeoff loses that much run, and the lip
# lift's rows of takeoff room); stick_deg, off-axis stick error (the flight's cosine, and the landing room
# across the flight line); clearance, feet above the far lip and every hurdle (m); landing_margin, body centre
# past the far edge (m); lift_allowance, how far a plain
# ledge's lip (a vertical face, a flat top) may stand above the rank's apex for the collision lip lift to mount
# it (m); max_drop, the longest drop counted (m); slippery, may a takeoff or a landing be a slippery (0x8051)
# floor.
#
# The lip lift [verified xemu, s6 §5 and calib §4, placed: the plain jump (no_shield) on one ledge; [inferred]
# for the air kits, whose jump or flaps were not measured on a lip]. A lip up to 0.2343 m above the apex mounts
# from 0.65-3.69 m before the face (s6). Above that the takeoff window narrows as the lip - apex deficit grows
# (rows sampled 2 apart, so each edge is +/-1 row; row r takes off 0.65 + (31 - r) x 7/30 m before the face):
#   0.4271 m: rows 22-28 mount (1.35-2.75 m), 20 and 30 fail (7-9 ticks)
#   0.4745 m: rows 23-27 mount (1.58-2.52 m), 21 and 29 fail (5-7 ticks)
#   0.4987 m: rows 25-27 mount (1.58-2.05 m), 23 fails (>= 3 ticks)
#   0.5232 m: no odd row mounts
# Each player tier's lift_allowance is the largest deficit measured to mount over at least max(takeoff_window,
# 1) rows. The rule (envelope.py's lip_lift_window): a deficit up to the tier's allowance counts from the window
# measured at the smallest deficit at or above it, whatever the tier, so the tiers nest; [phys] counts up to its
# allowance from between s6's nearest failing takeoffs (0.42-4.39 m) [proposal]. The reach model (R1.3) also
# owes the takeoff room: the floor must allow a takeoff over at least max(takeoff_window, 1) rows (7/30 m each)
# of that window.

