[[trick]]
name = "pstorage"
description = "power storage: in the tutorial select powers with LT held but don't evoke them, load another save, then release LT: the power is evoked even if that save has no access to it (e.g. an air flap with no air levels)"  # owner's words, shortened
mechanism = "armor_mgr (built once at boot, never cleared by a load) keeps the pending selection mask +0x10 and the LT-held byte +0x0C; the element level is checked only at the face-button press (0x83410). Releasing LT casts equip 0x838E0 at level max(1, min of the LOADED save's levels): air = air shield 1 (one flap; h 1.2, air control 12: exactly rjump's air1 kit), F = 5 s of light, AF = electric shield 1, the other 12 combinations = a level-1 staff. Saving while wearing it re-applies it on every load (magic.sav, equip flag 0). While LT is held the jump flag (0x850C3: Y != 0, latch +0x4B clear and LT = 0) and the roll flag (0x85195: BLACK, latch +0x4C, LT = 0) are both suppressed; only with the 'enable cheat buttons' cvar (0x38CA80, vanilla 0) does WHITE set the jump bit despite LT (0x850EA-0x8510B). So the selection is carried by any movement that needs neither flag: walking, swimming, walk-off drops, ladders, rides (and walked-into exits if E6 confirms)"
needs = "a save with the elements to select from: a new game's tutorial has 1/1/1/1"
entry_paths = ["the owner's: save, title, start the tutorial, hold LT with the combination selected, quit from the pause menu, load the save, release LT where needed", "straight from a new game: at the tutorial's end hold LT and select (e.g. X+B for steam), keep LT held through the tutorial skip, the intro and the load into w1 [video: deOODDGOQFQ@01:54; xemu E6]"]
carry_rule = "a pstorage skip sits only on an edge whose source is reachable from a save point with LT held, by edges needing neither the jump nor the roll flag: walking, swimming, walk-off drops (fall cost applies), ladders, rides, and walked-into exits if E6 confirms. A stored armour cast is dropped by swimming after the cast (0x8D1A5/0x8D1BA). One cast per trip, renewable: turning a pstorage skip on never shrinks R. [verified xemu, skips-c 2026-10-12: E2 walking (7.0 m/s) and a 112-row swim with LT held keep the mask; BLACK gives no roll, and Y with LT held toggles the stored air off. E6 a walked-in exit keeps it (w1 -> town, 3 of 3), so walked-into exits are in; the tutorial-exit entry was not reproduced and stays out until its input is known (default taken under D115 in skips-c). E2 released in water, the cast is dropped on the next swim tick. E2b a stored air flap must be released standing, then jump, then flap: released in mid-air after a walk-off with no jump since the load, the flap gives zero lift (peak_z is the constructor's 0.0 after a load, and LT blocks the jump that would set it; the reason is inferred)]. Steps R1.38b and R1.40 (AZ-816, AZ-818): each A (earth) or X (water) press with LT held clears that element's bit in the stored mask if it is set, at any level or fuel, and otherwise sets it only at level 1+ with fuel left, else only the flag 0x40 (0x83410, docs/RE_XBE.md). So a carry that dives (A) or rises (X) in water needs the counted tap w1.pstorage_electric_arch's note gives before the release where that element is at 1+ [verified xemu, R1.38b], and loses a stored earth or water bit (acid, steam, water and smash hold one) for good where that element is at 0 or has no fuel [static: 0x83423-0x8342B, $EV/r1.40-pstorage-element-tap-2026-10-28/skeptic-dis-83410.json]; walking, a walk-off drop and a swim at the surface press neither, and a dialog's A is not seen (the armor tick waits while a dialog is up) [verified xemu at kit 0, skips-c; inferred at