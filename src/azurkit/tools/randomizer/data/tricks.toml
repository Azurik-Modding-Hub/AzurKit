[[trick]]
name = "rjump"
description = "roll jump: chain rolls off a ledge and jump on the frame a roll ends; the fall is cancelled and air flaps work again; limited by deaths after free falling too long"  # owner's words, shortened
mechanism = "on the tick a roll (state 0x100) ends, the state machine 0x8CCC0 runs state 0's ground handler 0x8D10C even in mid-air, and its player_jump_init 0x89060 has no ground test: vz := +v0 (the fall speed is discarded), the flap ceiling := here + h, flaps := 0. Chained rolls in the air keep vx/vy and fall freely (no air control, no flaps). Death: fall_death_dispatch 0x8BE00 kills when min(drop below the last floor, v^2/2g) > 65 m ('fall height 4'), 110 airborne ticks from rest; the jump resets only the speed term. Landing costs nothing when |vz| <= 10 m/s, from any height"
needs = "no item; air kits extend it (rjump_tiers.toml kits); pstorage's stored air shield is exactly the air1 kit"
difficulty_basis = "a generated rjump skip is rated by its envelope cell (the lowest rjump_tiers.toml tier whose cell for its kit covers the edge, [[skip_rule]] rjump_edge); a video site with no computed edge yet is rated from the runners' account. What makes one rjump skip harder than another is the roll-start spot relative to the edge and the roll count, not the jump window (one tick in code, but buffered: `buffering` below [owner, D114 + verified static]); xemu A1 measures the buffer window W that rates each skip [xemu A1-A5, 2026-10-12: the windows are wide (Y 22 ticks, the chain press 11 roll ticks), so they rate no skip; B1-deep shows the roll-start spot does (measured_xemu)]"
confidence = { mechanism = "verified static (48/48 instructions) + verified L2 (5 whole attempts match the model within 1e-4 m)", in_game = "verified xemu (skips-a, 2026-10-12): the controls A1-A5 and B1-B2 pass; no rjump skip attempted yet (A6: no takeoff located)", buffering = "owner-attested (D114, 2026-10-12) + verified static + verified xemu (skips-a A1-A5: the windows in buffering)", sites = "video, unverified (18 timestamps)", envelope = "computed (rjump_tiers.toml; no geometry, flat-ground roll exit speed); the cells reproduce exactly from rjump.py model + toml [SKEPTIC 4]" }
buffering = "roll jumps buffer [owner, D114, 2026-10-12, verbatim: 'roll jumps do buffer, you can press the next roll jump before the previous finishes, and press the jump button before a roll jump finishes to buffer it.'] and [owner, 2026-10-12, verbatim: 'yes you have to hold the roll or jump button also']. [verified xemu] refines (skips-a A1-A5, 2026-10-12; vanilla-flat, real input): (1) The jump: Y must be down on the roll's end tick. It may go down anywhere from the BLACK press to the tick before the end tick (22 ticks; 11 press ticks sampled, 16 of 16 runs jump), and released before the end tick the end tick walks (A2, 4 of 4), as the owner said; LT down on any tick up to the end tick blocks it (A3). (2) The next roll does not buffer by holding BLACK: BLACK held from the first roll never chains (the latch +0x4C stays set). Only the time of the press counts: a press registered on roll ticks 12-22 (roll tick 1 = the enter tick; 11 ticks) starts the next roll, on roll ticks 12-20 (9 ticks) with period 19, on tick 21 with period 20, and on the end tick itself as another roll instead of the jump (period 21, A5). Presses on roll ticks 5-11 do not chain, and one after the end tick is too late (the end-tick jump fires). Held and tapped presses behave the same (9 pairs); 0x88A9B's 0.3 s rule sets the early edge (a press 9 ticks old at the chain tick fails). The static reading [verified static, tricks/rjump/REPORT.md 1.2, 1.3, 1.6] agrees for Y: the jump flag 0x04 (0x850C3-0x8510B) is level-triggered, nothing in state 0x100 reads Y, and player_jump_init 0x89060 takes it on the end tick. So the envelope's safe, standard and hard cells (a buffered jump and period-19 chains) stand, and the input windows limit no skip: the roll-start spot and the roll count rate a skip"
video_limits = "5 rolls are safe, 6 if the chain starts just before a ledge; about 5.5 rolls of falling voids out; a jump or flap just before landing resets the fall [video: deOODDGOQFQ@06:00, @14:19; matches death at tick 110, VIDEO_CATALOGUE 1.1]"
evidence = ["tricks/rjump.py", "tricks/rjump_static_check.json", "tricks/rjump_l2_check.json", "tricks/rjump_l2_sequence.json", "tricks/rjump.json", "tricks/rjump_tiers.toml", "tricks/rjump_vs_plain.json", "tricks/VIDEO_CATALOGUE.md", "tricks/rjump/REPORT.md", "tricks/SKEPTIC.md"]
questions = ["is a grabbable surface ahead a hazard (0x8A200 takes the press as a jump-to-grab)?"]
measured_xemu = "skips-a (2026-10-12) [verified xemu; the B rows placed by R6 on tern ledges, then real input]: a roll is exactly 21 rows of 0x100; the end-tick jump gives vz +4.643275 m/s and peak_z = the jump centre + 1.1 (A1). In the air the end-tick jump replaces any fall speed with exactly +4.643275 m/s (+4.849742 with an air shield) and resets the flap ceiling, so the next flap is full (B1, B2: gauge -1/Flaps, shield kept; with air 2 the second flap is the cap flap). B1's start-distance sweep (0.25-3.25 m from the edge, 13 values) jumps in the air every time with 0 HP. B1-deep: over a ~10 m drop (landing 9.9-10.5 m below) two rolls + Y cancel the 10 HP landing when the body leaves the ledge on roll ticks 2-6 (start 0.25-1.0 m from the edge; 8 of 8 landed runs; tick 7 untested, tick 8 and later cost 10 HP). That depth sits at the safe cell's 10.25 m dead-zone boundary, and whether a >= 5-tick leave window meets the safe tier's 6 is open (provisional standard). skips-e (2026-10-12) [verified xemu, placed on the w1 bay's west rim slope, then real input]: chained rolls in the air keep the horizontal velocity (vh 6.995 m/s and its heading held through a 177 deg yaw flip; period 19 ticks); the 65 m fall-death rule also runs in roll state 0x100 (0x8BF59 at k120, HP to 0); the mid-air roll-jump works from vz as low as -35.78 m/s, sets vz +4.849742 (air 1 and air 2) or +4.643275 (no shield) and re-latches peak_z, so the next flaps are full; a roll starts from slope state 3 at 2.447 m/s, 25.5 deg off the facing, and keeps that speed through the chain; released air steering decays x0.983 per tick"
answered = ["A1's question, does holding Y through the roll buffer the jump (if not, every rjump skip would be rated 4): the owner, D114 (2026-10-12): roll jumps buffer, both the next roll and the jump (OWNER_TRICKS.md). A1 now measures the window, not whether it exists", "A2's question, does a jump press released before the roll ends still buffer: the owner (2026-10-12): no, hold the roll or jump button (OWNER_TRICKS.md); matches the static reading; xemu A2 (2026-10-12) agrees", "A4/A5's question, does holding BLACK or a late tap start the next roll: xemu skips-a (2026-10-12): holding never chains; a press on roll ticks 12-22 does, held or tapped (buffering)"]
superseded = [
  "D113 (2026-10-12): default_tier = 3; default_tier_basis = 'the code window is exactly one tick (the roll's end tick), but the inputs buffer: BLACK 0.3 s, Y held through the roll [verified static; not yet seen in xemu]. The real difficulty is the roll-start spot relative to the edge and the roll count, so every computed clause carries its own tier. 2 if xemu A1 confirms the hold buffer; if A1 fails (Y must land on the exact tick, the runners' same frame) only the frame_perfect cells stand and every rjump clause becomes @4'",
