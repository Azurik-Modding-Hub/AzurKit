[[trick]]
name = "tjump"
description = "tree jump: hold up and press jump repeatedly on a ladder against certain geometry, with no air shield worn, to charge jump velocity, released as a super jump at the top; mostly used to skip the puzzle that opens the Great Tree to the air realm, with no powers"  # owner's words, shortened; 'no air shield worn' from SKEPTIC 1.6
mechanism = "on a climbable, player_jump_init 0x89060 runs before anything else in the climb (1) and catch (0x101) states; with a steep stored normal (+0xB8, written only by a non-catch tick's contact) each press ADDS v0*n_xy (4.643 m/s for a vertical wall) to the horizontal speed and REPLACES vz with v0*n_z (faces with n_z >= 0.7071, 0x198598, take the ground branch: no charge). The air->climb catch 0x87120 (stick up, a climbable ahead) returns before the airborne tick commits the move's velocity, so the charge survives while every press lands in the catch state; one late press lets the climb tick wipe it. With an air shield worn, a press that lands in state 2 runs wing_flap, raises vz above the catch gate (0.163 m/s) and the airborne tick commits the charge: the loop needs no shield [inferred: 0x89300 entry, 0x8977A gate]. On the e6 tube every face has n_z 0-0.026 (v0*n_z <= 0.12 m/s per press, under the gate), so the charge is horizontal. How the release turns it into height is unverified; the owner's hypothesis (2026-10-12): the horizontal charge is redirected upward by collision against sloped or angled geometry, which is why it works only at specific spots or angles"
needs = "no item (owner: 'can be done with no powers'); a state: no air shield worn [xemu skips-a I1, 2026-10-12: with an air-1 shield the k = 2-3 mashes still charged (121.7 m/s after 31 presses), so the shield does not break the loop at those cadences; the state is kept as the conservative need until a slower cadence is tried]"
difficulty_basis = "from the measured catch window W (ticks in 0x101 per press) and the press count N together ([envelope.tjump] difficulty_gate). A tjump skip is never safe or standard: 10-40 presses in a row, one late press loses the charge, a release that works only at specific spots or angles [owner], and the release unmeasured (the WR runner reports about 50% success; v2 calls it too random for runs)"
release_hypothesis = "owner (2026-10-12): the horizontal charge is redirected upward by collision against sloped or angled geometry at specific spots or angles. Candidate law [inferred, for the record]: the move's contact projection v' = v - (v.n)n turns a horizontal charge vx against a face with normal (-cos t, 0, sin t) into a vertical part vx*sin t*cos t, at most vx/2 at 45 deg, so a 90-140 m/s charge (about 23-40 presses) would give >= 45 m/s up, which the trunk entry needs. Unchecked against the move code's contact projection (0x47380). Pending: an L2 model and a scan of the e6 faces by a separate agent, writing only under tricks/tjump/deflect/ (not read here)"
confidence = { mechanism = "verified static + L2 (per press: horizontal += v0*n_xy, vz := v0*n_z; the caught tick blends, commits no move)", loop = "verified xemu (skips-a I1, 2026-10-12; a placed seed in the e6 tube, then real catches): each caught press adds 4.6434 m/s along the stored normal (4.8497 with an air-1 shield) and sets vz 0; 0x101 lasts 16 rows; press intervals k 2-17 keep the charge and k 18-20 let a state-1 row wipe it; 36-37 presses from the low hang (8.45 m below the rim) give 129-132 m/s; each catch lifts the body 0.195-0.207 m; with an air-1 shield the loop still charges at k 2-3 (the inferred shield break is refuted there)", release = "owner hypothesis confirmed in code + L2 (tricks/tjump/deflect/REPORT.md, 2026-10-12): the move code projects velocity onto the contact plane (v' = v - (v.n)n; no cap), so a sideways charge meeting a tube rim edge 0.58-0.88 m below the body centre keeps 40-65 m/s up; the e6 scan's surviving candidates (E, D, C: rim launches at tube corners) reach the E6_A1 trigger from above on about 1 attempt in 12 (1 in 25 with 0.1 m height spread) and need >= 24 presses; they hold only if the runtime catch-probe offset ([0x38B678] - [0x38ABB8]) lets a charging body hang that high; xemu I2 pending. [xemu skips-a I1/I2, 2026-10-12: the offset is +1.195585 m above the body centre (2.269 - 1.073415), so a charging body hangs at least 1.03 m below the rim (catches from 1.228 m or more below succeed, from 1.032-1.174 m below fail): candidate E, which needs the probe 0.58 m or more below the centre, is impossible, and D (0.67-0.77 m) and C (0.82-0.88 m) the same way [inferred: only side 5 measured]. Three tube-top releases gave no lift (vz -0.33, gravity only; the charge fell to 42-43 m/s on the failed catch), and 0x7A167 fired only on water entry, with no E6_A1 touch and no load. The skip's real release is unreproduced: an owner demo or I3's teal wall next]", location = "computed (the only tube all round at a waterline; e5#0 has a 0.8