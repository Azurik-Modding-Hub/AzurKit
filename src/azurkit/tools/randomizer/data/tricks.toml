difficulty_rule = "the lowest tier whose rjump_tiers.toml cell for the kit covers the edge (max_drop_m and drop_intervals_m for drops, gap_open/gap_far for gaps; a safe cell rates standard, D259); the cells assume the buffered jump and chain presses, which the owner attests (D114)"
status = "held"
once_confirmed = "in_logic"
confirmed_rule = "D114: each generated skip is written confirmed = \"no\" and held (unconfirmed (D114)) until its own instance is reproduced in xemu with its kit (REPORT.md 2, row A6) or the owner confirms it"
example = "a 30 m open drop gives two skips: <level>.rjump.<from>.<to>.none (difficulty 2: the standard cell's 65.5 m; the safe cell stops at 27.25 m) and <level>.rjump.<from>.<to>.air1 (difficulty 2: the air1 safe cell reaches 66.25 m, and a safe cell rates standard, D259); the edge's clause ORs both, and rjump_pstorage_edge adds a third"
source = "computed (rjump_tiers.toml; reach.py, which has not run it yet)"
