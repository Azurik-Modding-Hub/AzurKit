[[trick]]
name = "bskip"
description = "barrier skips: a general term for skipping any barrier, such as the fire barrier between w1 and town (e.g. around it with air power 2)"  # owner's words, shortened
mechanism = "a family: (1) over the top from higher ground (the arc clears the solid and its fire field: the 1.55 m half-thick field, not the solid plane, is what stops a walker; the field does not reach above the solid top [verified xemu, placed, skips-b: two crossings over the shut w1 FireWall_01 from R0236 with no contact]; the hit handler 0x8D600 has no state test, so a roll is still knocked back); (2) round an end that does not close the passage (the owner's air-2 example; f2 and a6 acid blocks in the videos); (3) rollthrough of a push-back field (0x8D6F0 zeroes out+0x1C in every 0x100 state; the push consumer is untraced) [xemu skips-h S1, 2026-10-12: a push volume sets the additive desired velocity (input+0x140..+0x148) to its push vector in every state, overlapping volumes adding up, but it moves only a swimming body: standing 0.02 m/s, walking up to 6.9 m/s and rolling at a per-run median 6.0-6.2 m/s inside a push-12 band; airborne not measured. So a push at or above the 10 m/s stroke walls off swimmers only, and a roll chain on the floor crosses it: w1.shoreline_rollthrough, 11 of 30]; (4) through a lit fire wall (candidate: 0x8D600 returns before both damage and knockback when [[0x38BB7C]+4] != 0, the 'no player damage' cheat, or when the per-player hurt state [+0x154]->+0xD8 has dword +0x18 or byte +0 set [verified static: dis 0x8D600:40, re-read 2026-10-12; meaning inferred: a post-hit window]) [xemu skips-b G5/G6, 2026-10-12: refuted as a walk-through: critter+0x1E0 is a 2.0 s post-hit timer and inside it the field neither hurts nor knocks back, but the solid BlockerShape holds the body 0.55 m before the wall plane; walk and roll both took 3 hits]; (5) out of bounds over terrain with no invisible wall (f6 seal) [video]. A skipped barrier is never destroyed, so each direction is its own skip. [xemu skips-d G1m, 2026-10-12, real input from the fixtures' own spots: method (2) at w1 FireWall_01 is a slope-recast climb of the slippery bank at the wall's left end (seen from the beach). A slope landing (state 3, contact n_z 0.61-0.89, slippery chunks included) allows a jump that keeps the slide velocity [workflow]; an LT+Y recast refills the gauge to 1.0 and a landing resets the flap count, so hop by hop the body climbs the bank and crosses the wall plane beyond its end (42 of 48 passes) or above its top (6). A running jump into the steep strip (n_z 0.40) turns speed into lift (vz 4.85 -> 6.27 m/s, vh 6.88 -> 3.27). Walking does not climb the bank. The field costs 11 HP with an air shield worn and 15 with none; every failed run touched it in front of the wall's left end]"
needs = "per skip: an air level (the skip's requires)"
difficulty_basis = "a computed skip is rated by the movement tier of its pass (bskip.py v2: the least tier whose arc clears the slab with that tier's margins, reported only where strictly cheaper than the way round; one skip per cell of bskip_draft.toml); a video skip from the runners' account; an owner rating above the computed cell wins (the higher)"
