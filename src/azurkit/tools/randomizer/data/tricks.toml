# Imported at Step R1.4 from the R0 evidence repo @ 4b8f3f3 (tricks/tricks.toml), re-imported at Step R1.4b @ 7530b0b (D145, rjc5), format keys /1; R0's scripts stay there.
# Below, FORMAT is docs/RANDOMIZER_DB.md, db-draft/ is azurik_mod/randomizer/data/, and R0's checks (db_check.py,
# tricks_check.py) are `azurik-mod rando check`.
# tricks/tricks.toml (DRAFT; restructured 2026-10-12 for D113): the randomizer's trick families ([[trick]]) and its
# skips ([[skip]]), synthesized from the six per-trick investigations (rjump, pstorage, bskip, tjump, itrig, nolight)
# plus saveanywhere, the owner's words (OWNER_TRICKS.md, verbatim) and the two commentated speedruns
# (VIDEO_CATALOGUE.md; videos/merged.json, videos/<id>.json).
#
# D113 (owner, 2026-10-12, verbatim): "i wouldnt rank tricks by difficulty, but rather specific skips."
#   - A trick is a technique family. It has no tier and no default tier: it names and groups skips and explains them
#     in the spoiler. Only `name` and `description` project into db-draft/world.toml's [[trick]] (FORMAT section 7).
#   - A skip is a named, located use of one or more tricks. It carries its own difficulty (2 standard, 3 hard,
#     4 frame-perfect since D259; 1 safe before, folded into standard) with the reason, the tricks it uses, what it
#     needs (`requires`), a status, its confidence and its evidence. Clauses name skip:<id> (FORMAT 5.1); skip:X
#     holds when the settings turn X on and X's own `requires` holds (FORMAT 5.4). id, name, tricks, requires,
#     difficulty, status, from, to, gates, batch and batch_name project into db-draft/levels/<level>.toml's [[skip]]
#     (FORMAT 4.8); every other key here is review material.
#   - Settings: a skip difficulty ceiling plus an on/off override per skip (db-draft/presets/*.toml until D144; since
#     D144 the player's own options, db-draft/settings/*.toml, FORMAT 7). The per-trick maximum tier is gone.
#     saveanywhere skips are `manual`: neither the ceiling nor a toggle turns one on. Raising the ceiling or turning a
#     skip on never shrinks R or Safe (the atom only ever appears un-negated).
#   - The movement envelope keeps a difficulty per derived edge, from its margin (FORMAT 4.3 `difficulty`). A derived
#     edge that uses a trick family is a generated skip ([[skip_rule]] below).
#
# D114 (owner, 2026-10-12, verbatim in OWNER_TRICKS.md): "for unconfirmed tricks, like air 1 skipping the fire
# barrier, we need to confirm they work before introducing them in our logic."
#   - A skip enters logic only once it is confirmed: reproduced in xemu with exactly the kit it encodes (its
#     `requires`), or confirmed by the owner in words that say it works as encoded. Every skip carries `confirmed`:
#     { by = "xemu", ref = "<sitting>/<row>" } (a row of REPORT.md 2; <row>:<skip id> for the A6 and G7 templates),
#     { by = "owner", ref = "<OWNER_TRICKS.md heading>" } or "no".
#   - A skip with confirmed = "no" is held, its held_reason starting "unconfirmed (D114)", whatever its evidence.
#     Skips seen performed in a speedrun video are held too, tagged priority = "video": the reproduction sitting does
#     them first (tricks/REPORT.md 2, "Confirmation queue (D114)").
#   - A generated skip ([[skip_rule]]) is unconfirmed until its own instance is reproduced or confirmed.
#   - Roll jumps buffer (owner, D114): the rjump family records it; the old "if A1 fails, every rjump skip is 4" caveat
#     is dropped (kept under `superseded`). xemu A1 still runs: it measures the buffer window that rates each skip.
#
# Ratings come from the evidence: the computed cells (bskip_draft.toml, the envelope tiers, nolight's hazard
# exposure), the windows the RE and xemu measured, L3's robustness under jitter, and how the runners describe each skip.
# D259 (owner, 2026-10-18; it replaces the old "where the evidence does not settle a rating, the higher (more
# conservative) one is kept" and P13's robustness thresholds): three tiers matching movement, Safe folded into
# Standard; the hardest recoverable unit is graded (per hop, D254); the lower tier is taken when sources disagree, a
# sparse window is read at its midpoint, and a death on failure doesn't raise the tier by itself.
#   - standard (2): no precise timing, or every input has a 3+ tick window and +-2.7 deg of aim, or 50%+ per attempt;
#   - hard (3): a 2-tick window or +-1.3-2.7 deg of aim, or 5-50% per attempt;
#   - frame_perfect (4): a 1-tick window or under +-1.3 deg, or under 5% per attempt from the real retry point (no
#     mid-air savestates), or only an exact input string works.
# The loader's floors stay: a tjump or itrig skip is hard or above, an in-logic video rjump skip standard or above.
# D259 amends D144(1)'s skip_ceiling scale: no skip is rated 1 any more, so ceiling 1 (safe, kept in the settings
# format) turns on none (a generated skip's movement tier of 1 rates 2 too). A held skip is graded again when it
# enters logic (R1.25). A re-graded skip's `difficulty_reason` ends with its D259 grade (every in-logic skip and the
# held ones D259 moved); the other held skips keep their old reason until then. A held skip that cannot be rated has
# no `difficulty`, and its reason starts with "unrated".
#
# Keys on a [[skip]]:
#   id, name           `<level>.<slug>` (the level the skip is performed in; stable) and a display name (the
#                      community's name where one exists);
#   batch, batch_name  D275 (owner, 2026-10-18): skips that cross the same thing (same level, from, to and gates,
#                      same tricks) and differ only in the kit they need are variants of one batch: its id
#                      (`<level>.<slug>`, no skip's) and display name on each variant. The player sees and picks
#                      the batch (one GUI row, one toggle, one share-string index); each variant keeps its own
#                      kit, tier, status, confirmation and evidence, and the ceiling admits each by its own tier.
#                      Projected to db-draft (FORMAT 4.8);
#   level, bypasses    the level, and what the skip gets past (prose);
#   from, to, gates    the db-draft edge it bypasses (node ids; "" = TODO, R0.7) and the hand objects it gets past;
#   zones              reach.py's bypass key, for a computed bskip cell (bskip_draft.toml);
#   dark_node          nolight.toml's dark node, for a nolight skip;
#   tricks, requires   the families used, and the items or powers it needs (a FORMAT 5 expression);
#   difficulty, difficulty_reason, status (in_logic | held | manual), held_reason;
#   confirmed          D114: { by = "xemu" | "owner", ref = ... } or "no"; an in_logic skip is never "no";
#   priority           "video" on an unconfirmed skip seen performed in a speedrun video (the sitting does it first);
#   confidence, evidence (paths under $EV/randomizer-plan-2026-10-10/), source (video id@mm:ss, owner, computed);
#   clause, plugs_into the expression the db field would hold with the skip in it, and which field (review; parsed);
#   superseded         the clauses or numbers this entry replaced (kept for review, never parsed);
#   xemu               a skip that failed in xemu: "failed: <short reason, ref>"; it stays held, with held_reason
#                      "failed in xemu (<ref>)" (2026-10-12);
#   note               review notes: what an xemu sitting found, dated, with its <sitting>/<row> ref (an inconclusive
#                      attempt, or an owner-confirmed skip the sitting did not reproduce).
#   tiers              D145: the movement tiers (safe | standard | hard | frame_perfect) at which the skip adds reach
#                      over plain movement with its kit; absent = every tier. Projected to db-draft (FORMAT 4.8); a
#                      record, not a gate (turning a skip on where plain movement already reaches its target changes
#                      nothing) (2026-10-12);
#   d145               D145: why it is a skip (what it adds, at which tiers and air levels), with the classify and
#                      verify lanes' verdicts (2026-10-12);
#   xemu_ref           on an owner-confirmed skip that a sitting then reproduced: "<sitting>/<row>:<skip id>" (the
#                      owner's `confirmed` ref is kept; the xemu evidence is in `note`) (2026-10-12, second sittings);
#                      a list when sittings reproduced different parts of one skip (2026-10-12, skips-g).
#
# Rules: no world coordinates (heights and distances are relative: to a ledge, a jump point, a waterline or the
# e6 tree core's axis and base) and no game bytes. VAs and collision words are addresses and flags, not bytes.
# Paths are relative to $EV/randomizer-plan-2026-10-10/ ($EV = ~/Documents/Azurik/evidence).
# Labels: [verified static] (capstone/ramdis), [verified L2] (the game's own code in Unicorn), [computed] (scripts on
