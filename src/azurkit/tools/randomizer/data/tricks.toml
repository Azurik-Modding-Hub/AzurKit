[[trick]]
name = "itrig"
description = "invisible triggers: clip through the level geometry in a few rare places and activate a trigger such as a level-loading zone; mostly in w1, to skip the dark cave and reach the alternate route to town where a water disc fragment is"  # owner's words, shortened
mechanism = "a touch is a point-in-mesh test of the body centre (floor + 1.0 m) against the trigger's own mesh (0x60BD0 -> 0x79D30 -> 0xD2A40 up-ray, touch := 1.0 at 0x7A167); walls are never consulted and collision faces are one-sided (0xB9FA5: tested only when n.motion < 0). So where a trigger box sticks out of the level's one-sided shell, an out-of-bounds body falls into it with no true clip; the touch fires mid-air, before any landing. The touch starts the cutscene and the body keeps falling to the water at least 20.4 m below the box: survival needs v^2/2g <= 65 m at the water contact; a flap more than 6 m below the ceiling empties the gauge and drops the shield"
needs = "per skip: the out-of-bounds kit (the skip's requires)"
difficulty_basis = "an out-of-bounds climb, then a steered fall into a trigger box: positional precision and retries, no single-frame input. No itrig skip is safe or standard (the old tiers had nothing there)"
confidence = { mechanism = "verified static", w1_site = "computed (two independent agents) + video (three runs) + owner (clip O3b1iVZlaLg)", drop_kit = "withdrawn until F2: the 2.0/8.3/10.3 m margins were measured at the touch, not at the water contact, and assumed a descent flap costs one flap (it costs the whole gauge: consume_fuel(100.0) at 0x893CD-0x893D4, 0x842D0 empties and unequips [verified static 2026-10-12]; L2 stale_ceiling: fuel 0.0, shield dropped). [xemu skips-b F2, 2026-10-12; placed drops from the modelled hill top, the fall reference 63.0-63.6 m above the box top: the water contact (0x8BD86, swim) registers only 28.1-29.1 m below the box top (the water top is 27.1 m below it [computed]); air 2 died in every variant (no descent flap: at the 65 m rule; one: at 74-77 m; two with a mid-air recast: at 88.9-90.35 m, at the water top, with no contact); air 3 with three descent flaps and two recasts reached the water alive (1 run). A descent flap costs the whole gauge and a recast refills it five ticks later without resetting flaps_used. A body that died on the box's cave floor still loaded town, so the pass is HP > 0 at the water contact or the load. 0x7A167 is not box-specific: it also fired near the water in drops that never entered the box. The modelled takeoff does not fit the owner's air-2 kit: recheck it against the runner's real takeoff (VIDEO_ANALYSIS.md)] [xemu skips-e, 2026-10-12; placed on the out-of-bounds rim slope, a sliding start, then real input: the runner's takeoff is the bay's west rim, a 50 deg slope (n_z 0.64) 52-66 m above the box top and 22-27 m from the box [computed], not the hill top. The video's technique: roll off the rim, chain 5 rolls in the air, roll-jump in mid-air about 15.8 m above the box top (vz -29.6 -> +4.85, the flap ceiling re-latched), two full flaps, steer onto the box's open north-east part, touch it and fall into the water alive. Air 2: 32 of 64 (the main setup 6 of 6, identical replays); air 1: 10 of 13 with one