# tjump: the charge law [verified L2: one press adds v0*|n_xy| and sets vz := v0*n_z; the 0.6^dt air blend toward
# air control 9 m/s along the stick; the stick's sign s is inferred] and the horizontal release range [inferred: stick
# held along the charge (s = +1), no geometry, vz not modelled]. How a release turns speed into height is the open
# xemu question (I2); the s6 lip lift turned 7.3 m/s of run into vz 3.7 m/s at a 1.26 m ledge.
[envelope.tjump]
v0_m_s = 4.643
blend_per_tick = 0.983117  # 0.6^(1/30)
law = "v_next = 9*s + (v + v0*|n_xy| - 9*s) * 0.983117 per caught press; s = +1 stick along the charge, -1 into the wall [add and blend verified L2; s inferred]; faces with n_z >= 0.7071 take the ground branch (no charge)"
steady_state_m_s = { stick_along = 279.4, stick_into_wall = 261.4 }
charge_m_s = { presses = [1, 5, 10, 20, 40], wall_vertical = [4.7, 22.8, 43.7, 80.6, 138.0], wall_vertical_stick_into_wall = [4.4, 21.3, 40.9, 75.4, 129.1], wall_60deg = [4.1, 19.8, 38.1, 70.2, 120.1] }
