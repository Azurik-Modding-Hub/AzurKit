difficulty_basis = "the menu procedure has no timing window [verified L2 + static]: standard (2; safe, 1, until D259 folded Safe into Standard). A skip that spends the cast on a jump is rated the higher of 2 and that jump's own difficulty"
confidence = { mechanism = "verified L2 (the owner's sequence, all 15 combinations) + verified static (load path, writers)", in_game = "verified xemu (skips-c, 2026-10-12): E1 the owner's sequence 5 of 5 (air_shield_1: v0 4.849742, h 1.2, air control 12, one flap, air fuel 50 -> 48; the same numbers as a real air-1 cast); E1b pstorage + rjump on the ground 7 of 7 (the mid-air variant not reproduced: no ledge over 2.5 m in reach of W1_3); E2 and E6 the carry rule (carry_rule); E2b a mid-air release flaps with zero lift; E3 hazards (a bare LT tap drops it; a second Y toggles it off); E4 saved while worn, it is re-applied on every load (equip flag 0); E5/E5b six level-1 gates open (gate_effect)", carry_rule = "verified static: LT blocks only the jump and roll flags (ramdis.py dis 0x850A0:40 and 0x85188:22, re-read 2026-10-12) + owner (a swim with LT held keeps the selection); walk-off drops, ladders and rides need neither flag [inferred] (xemu E2's walk-off row); walked-into exits only after E6 [xemu skips-c 2026-10-12: E2's walk and swim and E6's walked-in exit verified]", kit_identity = "verified data: rjump.json kit air1 (h 1.2, air control 12, Flaps 1) = pstorage_l2.json stored_air_flap (air_shield_1, v0 4.8497, air control 12, one flap)", gate_effect = "verified xemu (skips-c E5/E5b, 2026-10-12): a stored level-1 cast from a 0-level save opens six level-1 gates (w1 IceBlock_01 steam 5 of 5, w1 FireWall_01 water 5 of 5 end to end, the w1 ElectricArch electric shield 4 gate-state + 3 walk-throughs, w2 IceBlock_02 steam 4 of 4, f3 AcidBlock_01 acid 4 of 4, the w3 smash shield 5 of 5): those six skips are in logic. The level-2 steam gate w3 IceBlock_026 stays shut (2 of 2: a stored cast stops at level 1); no level-2 control was run for acid, smash, water or the e5 arch" }
