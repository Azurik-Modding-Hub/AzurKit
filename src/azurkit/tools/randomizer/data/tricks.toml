e carry starts from a save in the bay, not W1_3 (the beach, w1.Z004, from which no kit-0 edge reaches the bay; w1's save platforms w1_1 and W1_2 lie in w1_bay's zone): each kit's save made at w1_1 [placed setup: the kit poked, the player put on the platform, the game's own save], then E5b's store and that save's load, and from the load on real input only: off the platform, 65 m across the bay, S1's dive, tunnel and shaft onto the porch. Kit 0 held (crossed, w1.Z090, HP 200). PROCEDURE at a kit with earth or water 1+ (fuel left): every A (X) press with LT held flips the earth (water) bit (0x83410), so the dive's A and the shaft's X can leave it selected, and let go then the mask casts a staff (7, 14 or 15), not the shield: the arch throws you back (E1, W1, H1, H2 as they came: 4 of 4 shut, HP 200 -> 125-140). Before letting go of LT, tap A once more if earth 1+ and A was pressed an odd number of times since the save's load, and X likewise for water, so only air and fire stay selected (at level 0 or with no fuel a tap only sets 0x40, harmless); tap back from the arch or in the pool (the A tap is a lunge: H1 and H2 met the shut arch, -15 HP). Tapped so: earth 1 (A), water 1 (X), earth/air/fire/water 3/3/0/3 and 3/0/3/3 (A and X) each cast the shield (type 6, level 1) and stood in the hall (w1.Z090), HP 200, 200, 185, 185. Controls (each kit's save, no store, the same route with LT never held and no tap): thrown back, HP 200 -> 125. A second start in a fresh sandbox ($EV/r1.38b-pstorage-arch-kits-2026-10-28/sitting/second/REPORT.txt) re-ran all 10 rows: every recorded value the same"
