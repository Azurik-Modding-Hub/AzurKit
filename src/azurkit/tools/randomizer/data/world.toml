# Imported at Step R1.4 from the R0 evidence repo @ 4b8f3f3 (db-draft/world.toml), re-imported at Step R1.4b @ 7530b0b (D145, rjc5), format keys /1; R0's scripts stay there.
# Below, FORMAT is docs/RANDOMIZER_DB.md, db-draft/ is azurik_mod/randomizer/data/, and R0's checks (db_check.py,
# tricks_check.py) are `azurik-mod rando check`.
# world.toml: start, hub, victory, the trick families and the non-monotone mechanisms (DRAFT, R0.6, 2026-10-11;
# trick families revised 2026-10-12 for D113; six added for D120).
# Spec: db-draft/FORMAT.md section 7.

format = "azurik-rando-world/1"  # prefilled
start = "w1_beach"  # migrated, unverified (starting_node; the owner's notes agree)
hub = "town_central"  # prefilled (RANDOMIZER_PLAN section 2.3; logic_db's town_core)
victory = "flag:d1.spideyzar.killed"  # prefilled (D76 / RQ-1; replaces logic_db's discs + placement events)
starting_items = []  # migrated, unverified
# logic_db victory_condition was: {"type":"all_of","items":["disc_air","disc_water","disc_fire","disc_earth","disc_life","event_place_disc_air","event_place_disc_water","event_place_disc_fire","event_place_disc_earth","event_place_disc_life"]}  # migrated, unverified

# Trick families (D113, 2026-10-12): a trick has no tier; difficulty sits on each skip, in the levels' [[skip]]
# lists (FORMAT 4.8). Drafted from tricks/tricks.toml, whose `name` and `description` project here (tricks_check).
# Before D113 each entry also carried default_tier (bskip 2, pstorage 3, saveanywhere 5, rjump 3, tjump 3, itrig 3,
# nolight 1; prefilled proposals).

[[trick]]  # drafted (D113)
name = "bskip"  # prefilled (OWNER_NOTES)
description = "barrier skips: a general term for skipping any barrier, such as the fire barrier between w1 and town (e.g. around it with air power 2)"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "pstorage"  # prefilled (OWNER_NOTES)
description = "power storage: in the tutorial select powers with LT held but don't evoke them, load another save, then release LT: the power is evoked even if that save has no access to it (e.g. an air flap with no air levels)"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "saveanywhere"  # prefilled (OWNER_NOTES)
description = "save anywhere: the in-game cheat White, Up, Down, A, B, right-stick press saves anywhere; saving and reloading allows falling infinitely, resets fall damage, or rarely clips through geometry"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "rjump"  # prefilled (OWNER_NOTES)
description = "roll jump: chain rolls off a ledge and jump on the frame a roll ends; the fall is cancelled and air flaps work again; limited by deaths after free falling too long"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "tjump"  # prefilled (OWNER_NOTES)
description = "tree jump: hold up and press jump repeatedly on a ladder against certain geometry, with no air shield worn, to charge jump velocity, released as a super jump at the top; mostly used to skip the puzzle that opens the Great Tree to the air realm, with no powers"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "itrig"  # prefilled (OWNER_NOTES)
description = "invisible triggers: clip through the level geometry in a few rare places and activate a trigger such as a level-loading zone; mostly in w1, to skip the dark cave and reach the alternate route to town where a water disc fragment is"  # drafted from tricks/tricks.toml (the owner's words, shortened)

[[trick]]  # drafted (D113)
name = "nolight"  # prefilled (OWNER_NOTES)
description = "no light: doing a dark room or maze without the fire power; possible but inconvenient"  # drafted from tricks/tricks.toml (the owner's words, shortened)

# D120 (owner, 2026-10-12): the six video moves become families, each its own and with no tier; their skips stay
# held until xemu or the owner confirms them (D114).

[[trick]]  # D120 (owner, 2026-10-12)
name = "elevbounce"  # D120
description = "elevator bounce: land on the moving d1 central-spire elevator at the right moment and spot (holding forward, steadied with flaps) and bounce past most or all of its puzzle"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D120 (owner, 2026-10-12)
name = "iceclimb"  # D120
description = "ice climb: get up slippery ice, or a slide meant for coming down, by hopping up its centre line or flying it with flaps (w3's ice jet or bridge to frag_fire_1 without the frost switch; the e6 slide)"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D120 (owner, 2026-10-12)
name = "ledgepop"  # D120
description = "ledge pop: from high ground, drop off one ledge just right and Azurik pops up the wall; in f4 it skips most of the level and the Blaze Sentinel fight on the way to the battle platform, and needs a lot of air fuel"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D120 (owner, 2026-10-12)
name = "elevjump"  # D120
description = "lift jump: jump at the top of a rising lift, or touch a moving platform while moving, and keep its speed for extra height (f3's lifts, e2's tower lift, e5's moving platform)"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D120 (owner, 2026-10-12)
name = "botstep"  # D120
description = "bot step: draw enemies' attention and use their invisible hitboxes as steps (w3, over the icebergs); how it is done is not known"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D120 (owner, 2026-10-12)
name = "flipcancel"  # D120
description = "flip cancel: a little flip on landing after a roll jump cancels momentum that would otherwise kill (a5's monolith); the input is not known"  # drafted from tricks/tricks.toml (VIDEO_CATALOGUE 1.2, in plain words)

[[trick]]  # D630 (owner, 2026-10-24, Step R2.18)
name = "flutter"  # D630: the owner's name, "air fluttering"
description = "air fluttering: in mid-air, cast the air armor again (LT+Y) once its flaps are spent, for another flap, at 2 air fuel a cast; a flight is bounded by the air fuel, not the armor's flap count"  # drafted from tricks/tricks.toml (the owner's X.67 demo, D630)

