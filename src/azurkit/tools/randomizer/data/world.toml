# Non-monotone mechanisms (RANDOMIZER_PLAN section 3.1): the loader refuses a database that uses one without
# declaring it here. Handling: forfeitable | product_bit | out_of_logic | harmless | keys_vanilla.

[[mechanism]]  # prefilled
id = "disc_teleport"  # prefilled
kind = "one_shot_teleport"  # prefilled
handling = "forfeitable"  # prefilled (RQ-4 / D81)
note = "a6, w3, f6, e5: count >= 4 AND the town has not placed the disc; w1 BossDefeated: water >= 4 and a touch, no placed check; life: none (thresholds/disc_chains.txt). Level-triggered [inferred, static: the gameState is refreshed every frame, 0x711C0]; TODO(R0.4b-ii) I-7(a,d,e)"  # prefilled

[[mechanism]]  # prefilled
id = "timed_barriers"  # prefilled
kind = "respawn"  # prefilled
handling = "harmless"  # prefilled proposal
