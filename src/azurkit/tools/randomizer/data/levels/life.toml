# ---- barriers, buttons, events and location overrides ----------------------------------------

[[button]]  # keylock, generated requires key.life1>=1
id = "life.life_keylock1"
of = "life/g0/r30"
at = "life_lock_a"
mode = "latch"

[[button]]  # keylock, generated requires key.life1>=1
id = "life.life_keylock"
of = "life/g0/r200"
at = "life_lock_b"
mode = "latch"

[[event]]  # both top switches' goals arm the final joystick (FinalJoystickActivateCombiner = FinalSwitch1.goal & FinalSwitch2.goal -> JoysticPadTimer, which lowers the pad that carries the joystick and frag_life_4, LifeFrag4_generator under FinalJoystickPad) [verified data]; no power: the owner pressed a top switch (pad B, FinalSwitch2) with kit 0 and vouches for the other side (D209), and the pad is reached with kit 0 (X.28 spot5-prepad) [verified xemu, the owner's real input; pad A's side placed]
id = "life.final_joystick.armed"
at = "life_core"
requires = "event:life.BlockerShape_g0r243.action & event:life.Blocker2Shape.action"

[[event]]  # the final joystick's minigame [verified data: $RP r0/tools/logic_dump.py life '^(Xnor1|t1|s1|FinalMovieCombiner|BeamToggle|MovieTimer|andCombiner[235]|CrashToggle|LightResetToggle|ResetCombiner)$']: the stick steers the pilot ball (StearingTimer1, SpeedTimer) through the 20 filament cores (pSinks s1-s20 latch t1-t20), and all 20 (andCombiner2 & andCombiner3 -> FinalMovieCombiner) turn BeamToggle on (saved: the beam exits below) and run MovieTimer, which after 24 s takes away the solid ball (pSphereShape25/26, 3.5 m) that holds frag_life_4 on the pad [verified data: the fragment's generator point is inside the ball's mesh]. A touch of a stabilizer stream (pBoxSinks b1-b12), or letting go of the joystick, resets every core (ResetCombiner -> LightResetToggle) and greys the joystick for 5 s (CrashToggle, Xnor1); it is played again: no lockout. It needs nothing past the armed joystick: won with kit 0 too, then the beam's exit taken (Step R1.8n, cores-k0-1). Won in xemu (Step R1.8f, xemu-oracle-2026-10-13-r18f/results/runs.jsonl: cores-live-3, cores-live-4; Minigames.cores, real stick input, three crashes on the way): all 20 cores, BeamToggle on, MovieTimer ran out and the joystick let go; the walk on toward the fragment then ended in town (cores-reward-2; most likely the beam's field, the r1692 exit)
id = "life.filament_cores.won"
at = "life_core"
requires = "event:life.final_joystick.armed"

[[event]]  # derived: action of Blocker2Shape
id = "life.Blocker2Shape.action"
at = "life_pad_b"
requires = "true"

[[event]]  # derived: action of BlockerShape
id = "life.BlockerShape_g0r243.action"
at = "life_pad_a"
requires = "true"

[[event]]  # derived: action of BlockerShape
id = "life.BlockerShape_g0r419.action"
at = "life_z000"
requires = "true"

[[location]]
id = "life/g0/r259"
requires = "event:life.filament_cores.won & air>=3 & water>=3 & fire>=3 & earth>=3"
note = "frag_life_4 inside the joystick pad's solid ball until the filament-core minigame is won (life.filament_cores.won; Step R1.8f): the conservative-kit rule after both top switches (the route's life/g0/r259: the vanilla run takes it with both keylocks used; the pads stand in for the locks so the confirmed skip counts). The owner (2026-10-14): \"you drop down onto the beam, and the beam pulls you down into it, and then you get teleported to town after collecting it\". Once the cores are won the beam's column (FieldShape, 2.5 m round the axis, pushEnable by BeamToggle, pushZ -5 [verified data]) runs from the top of the tower down to ToTownFieldShape, the beam exits' trigger (Movie_levelSwitch, Town_levelSwitch below), and the fragment is taken high in the column, over the lowered pad [inferred: it stays where the pad held it before it was lowered]: a drop into the column there carries the player down through it and into that field. In xemu (Step R1.8j, sitting r18j, fragl4-deckdrop-1, -2): from the deck round the pad's old seat at the top of the column, a run off its inner edge with a jump (one flap or none) into the beam took frag_life_4 (fgl4 0 -> 1) and then town, 2 of 2 [verified xemu, placed: the cores' 20 switches latched (Minigames.cores won them in R1.8f and R1.8h, 0 of 1 here at 19 of 20) and R6 onto the deck]; from the lowered pad, a jump and flaps into the column passed 0.5 m from the pad-moved generator point and went to town without it (fragl4-drop-3). So the fragment is collected on a one-way ride whose end is the town exit: it sits at the arrival's node, whose only way out is that exit, and the exit is its way back (the escape takes it). The way up to that deck is the conservative-kit rule's (not run; no demo showed it, so its kit stays when the rest of life drops to kit 0, Step R1.8q)"

