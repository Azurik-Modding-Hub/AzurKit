# ---- exits ---------------------------------------------------------------------------------

[[edge]]  # Movie_levelSwitch -> town (spot); and(nand(life_disk_placed), touch(ToTownFieldShape) after timer43, BeamToggle) [verified data]: the beam's field once the filament-core minigame is won (BeamToggle; life.filament_cores.won); with Town_levelSwitch exactly one of the two is armed, so each carries the same requirement (default taken under D115)
