# ---- exits ---------------------------------------------------------------------------------

[[edge]]  # D1_Town_levelSwitch -> town (spot+Shape); touch(D1_Town_ExitFieldShape) [verified data]; the derive places neither its field nor the arrival on a floor: the arrival rides the grate elevator down into the seal's chamber (d1.Z031) [verified xemu, placed: sitting r111d], and the exit field is taken as the same elevator's way back up (default taken under D115); its arrival, D1_TownShape, stands on town's own grate elevator by the temple's death door, which the derive leaves without a floor: the temple's zone town.Z021, where toD1_levelSwitch leaves from (default taken under D115)
from = "d1_core"
to = "town_z020"
kind = "exit"
exit = "d1/g0/r2265"
requires = "true"
confidence = "data"

[[edge]]  # D1_D2_levelSwitch -> d2 (spot); touch(DeathLevelTransition:LevelDoor3:public_DoorFieldShape) [verified data]
from = "d1_z125"
to = "d2_door"
kind = "exit"
exit = "d1/g0/r2266"
requires = "true"
confidence = "data"

[[edge]]  # D2_movie_levelSwitch -> d2 (spot); the walk from walkway generator 2 (d1.Z056) onto the beam walkway past the bridge-end field fires it at kit 0, 5 of 5 in xemu and in the owner's demo (X.78, D722 row 10), so it leaves from there once walkway generator 2 (its plate beside d1.Z056) has raised the walkway (Step R1.24b; the derive's field zone is the walkway, d1.Z025). and(DeathMovie_disable_toggle, touch(DeathMovieFieldShape)) [verified data]: one shot (the touch turns the toggle off), harmless since the lab's only way out is the lens-locked door, after which the d1/d2 door pair stays open (default taken under D115); it lands the player from D1_D2_Fall alive on the lab floor d2.Z015 [verified xemu, placed: sitting r111d]
from = "d1_z056"
to = "d2_core"
kind = "exit"
exit = "d1/g0/r2271"
requires = "event:d1.walkwayGenerator2_PressurePlateShape.touch | event:d1.walkwayGenerator2_BaseShape.touch"
confidence = "data"

