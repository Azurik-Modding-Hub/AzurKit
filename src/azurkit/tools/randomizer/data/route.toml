# Imported at Step R1.4 from the R0 evidence repo @ 4b8f3f3 (route/vanilla_route.toml), format keys /1; R0's scripts stay there.
# Below, FORMAT is docs/RANDOMIZER_DB.md, db-draft/ is azurik_mod/randomizer/data/, and R0's checks (db_check.py,
# tricks_check.py) are `azurik-mod rando check`.
# route/vanilla_route.toml: the draft vanilla non-gem route (AUTO_LOGIC action 5, desk half), 2026-10-11.
# DRAFT for the owner's sign-off (RANDOMIZER_PLAN §4.3 Check 2). Written by route/build_route.py; edit the script, not this file.
# Glitchless: no PSG, no tricks, no out-of-bounds. Powers follow the town temple's hint order.
# Labels: [data ...] decoded gate (barrier levels [inferred, static] until R0.4b); [web: url] community, unverified (Q257);
#         [landmark] route/landmarks.json name bands; [migrated] old logic_db edge; [temple]; [inferred]; [assumed] = no source.
# `requires` uses db-draft/FORMAT.md §5; it is what the step needs locally, checked against the replayed inventory (`ok`).
# No coordinates: ids, names, counts and requirement strings only (RANDOMIZER_PLAN §4.4).

format = "azurik-rando-route/1"
status = "draft"
variant = "glitchless, no PSG"
location_steps = 203
action_steps = 74
replay_problems = 0
matches_temple_order = true
power_order = ["water1", "fire1", "air1", "earth1", "water2", "fire2", "air2", "earth2", "fire3", "water3", "air3", "earth3"]

[sources]
obsidian_list = "https://www.speedrun.com/api/v2/GetGuide?id=a4ktv (SillyGoose, Obsidian% route, 2017-04; follows Rueake Any% (PSG))"
rueake_notes = "https://docs.google.com/document/d/1UlTEjHD-KuCgLZceZJegdW6tKarr_ccaSWNMHEinQPU (routing notes, PSG route)"
forum_100 = "https://www.speedrun.com/api/v2/GetThread?id=hcwpo (area names, gem vectors; Dendris 2021 debug-name route, uses OOB)"
any_no_psg = "https://www.speedrun.com/api/v1/runs?game=m1m9px62&category=9kvj1gjk (1 run: Jettfighter 2:36:39, 2023-03-25; video has no chapters, no written route found)"

[area_to_level]  # [web, unverified] names -> [inferred] level, with the evidence
"Beach" = { level = "w1", evidence = "THREAD: How2BEpic names 'W1 (Beach)'; gem vector 25/18/17/(12->15) = w1" }
"Ring of Fire" = { level = "w2", evidence = "THREAD: gem vector 25/18/17/15 = w2 exactly; Rueake WP1/WD1 'Water Realm intro' = w2 power_water/frag_water_1" }
"Flower Pods" = { level = "w4", evidence = "Rueake 'Stormy Water Realm' AP1 + ED1 = w4 power_air/frag_earth_1; w4 flowers/fans in data" }
"Frozen Islands" = { level = "w3", evidence = "Rueake 'Ice Islands' WP2 + FD1 = w3 power_water/frag_fire_1; ICEBREIDGE and Snow_Blower records in w3" }
"Main Valley" = { level = "e2", evidence = "THREAD gem vector 18/24/16/14 ~ e2 18/25/16/16; ElectricArch L3 (entry 17 'Electro Shield 3') is in e2" }
"Drill Area" = { level = "e7", evidence = "THREAD gem vector 18/25/16/16 = e7 exactly; DarkRoom cell holds 2 obsidians (entries 23/24)" }
"Spotlight Area" = { level = "e6", evidence = "THREAD gem vector 17/24/17/16 ~ e6 17/25/17/16; Rueake ED3 'tree spotlights' = e6 frag_earth_3" }
"Conveyor Belts" = { level = "e5", evidence = "THREAD gem vector 17/27/16/17 ~ e5; conveyor track and Earth Guardian are in e5" }
"Volcano Area" = { level = "f2", evidence = "entry 38 'past Life Disk Fragment' + silver teleporter = f2 frag_life_3 + f2 Teleporters" }
"Battle Platform" = { level = "f4", evidence = "THREAD gem vector 19/17/20/19 = f1 or f4; f4 Boss_Platform; Fire Caverns takes f1" }
"Fire Caverns" = { level = "f1", evidence = "THREAD gem vector 19/17/20/20 ~ f1/f4; f1 Tunnel cells and 3 fire keys ('second key')" }
"Tesla Trees" = { level = "f3", evidence = "Rueake 'Electrical Forest' ED2 + earth power = f3 frag_earth_2/power_earth; 'second key' = f3 keys" }
"Guardian's Fortress (fire)" = { level = "f6", evidence = "the only level left with 5 obsidians; entries 49/50 name the Fire Guardian" }
"Guardian's Fortress (air)" = { level = "a6", evidence = "entries 80/82 'near Earth Power 3', 'green key' = a6 Earth3_generator, key_green" }
"Water Slides" = { level = "a3", evidence = "a3 SlipDown/SlipStraight/SlipCurve platforms; Rueake 'Rain Machine' slides = a3 power_water_a3/frag_life_2" }
"Air Tubes" = { level = "a5", evidence = "entries 62/64/65 'smokestack top' = a5 Smokestack platforms; ShipDock cell (entry 61)" }
"Great Tree" = { level = "a1", evidence = "entry 77 'Air Guardian's fortress entrance' = a1 (A1toA6 exit); a1 key/keylock 'tree' records" }
"Town" = { level = "town", evidence = "15 obsidians, by name" }

